# Secret-scanning gate: fails the run on any gitleaks finding.
#
# Deliberately a standalone workflow file rather than a new job bolted onto
# ci.yml -- ci.yml is edited by other in-flight tasks (the golangci-lint pin,
# the action pins generally) and this job has nothing in common with the Go
# gate, so it stays out of their diff.
#
# The gitleaks binary is fetched and hash-verified the same way ci.yml does
# kubeconform: pinned version, pinned sha256, no floating tag. `gitleaks git`
# exits 1 on any finding and 0 on none, so "the job is green" already means
# "zero findings" -- no separate assertion needed.
name: secrets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (zero findings)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not just the tip: gitleaks scans past commits too,
          # and a shallow clone would silently only cover HEAD.
          fetch-depth: 0

      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # Verified against the published gitleaks_8.30.1_checksums.txt for
          # gitleaks_8.30.1_linux_x64.tar.gz. Same "pin + verify" pattern as
          # the kubeconform install in ci.yml.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks scan (fails on any finding)
        run: gitleaks git . --redact -v
