version: "2"
run:
  timeout: 5m
  # Every custom //go:build tag under cmd/ pkg/ internal/ test/ (T-14,
  # internal/buildgate's TestRepoBuildTagsFindsTheKnownSixMatchesTheTaskList
  # pins the same six). Without this, golangci-lint only ever sees the
  # DEFAULT (untagged) build -- every file behind one of these tags (the
  # component/integration/images/live/chart/testclock suites) is invisible
  # to it, tag or no tag in any CI job that runs it.
  build-tags:
    - component
    - integration
    - images
    - live
    - chart
    - testclock
linters:
  enable:
    - staticcheck
    - govet
    - errcheck
    - ineffassign
    - unused
    - misspell
  settings:
    misspell:
      # "noteable_type" is GitLab's actual webhook JSON field name (not a typo);
      # pkg/ghook must decode it verbatim to parse real payloads.
      ignore-rules:
        - noteable
# golangci-lint v2 moved formatters out of `linters`. Without this block the
# lint gate is blind to gofmt drift, which is how unformatted code reached the
# branch in the first place.
formatters:
  enable:
    - gofmt
