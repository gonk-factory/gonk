# agents/triage/agent.toml -- THE DIRECTORY NAME ("triage") IS THE AGENT NAME.
# A `name` field in this file would be ignored by the loader (pack-spec.md
# 1.2.4: "If agent.toml contains a name field, the loader ignores it for
# identity and uses the directory name"). Do not add one and believe it.

description = "Reads a GitLab issue and posts exactly one triage comment plus labels."

# The model is NOT named here, anywhere in this pack, or on any agent. The
# model arrives per-session from gonk-meter's /v1/policy/decide response,
# which reads the OPERATOR's rung catalog (pkg/opercfg). The pack is
# model-agnostic BY CONSTRUCTION: naming a model here would hardcode one
# site's inference topology into an open-source pack and would silently
# disagree with the rung the budget was checked against.

# Pools scale to zero (spec 4.2): an idle gonk installation runs no agent
# pods. min_active_sessions is an AGENT-level field (internal/config's Agent
# struct) -- there is no such field on [agent_defaults], so it is set here,
# per agent, rather than once at the pack level.
min_active_sessions = 0

# --- The opencode harness (gonk-aql / minimal opencode leg) --------------------
# start_command is Gas City's escape hatch (internal/config/resolve.go step 1):
# it sets the session command DIRECTLY, bypassing the provider catalog -- so we
# do NOT depend on an "opencode" entry existing in the city's [providers]. The
# command is gonk's own entrypoint (baked at /usr/local/bin/gonk-agent-entrypoint),
# which renders overlay/opencode.json (the LiteLLM provider + attribution header)
# from the session's GC_WEBHOOK_ARG_* env and then `exec opencode "$@"`.
#
# The escape hatch does NOT inherit the builtin opencode provider's settings, so
# the two that matter are set explicitly here:
#   - prompt_mode/prompt_flag: deliver the rendered prompt as
#     `--prompt "<text>"`, appended after the command -> entrypoint forwards it
#     to opencode ("exec opencode \"$@\"").
#   - env OPENCODE_PERMISSION: auto-approve tool use, or a non-interactive
#     session would block on the first `glab`/edit permission prompt forever.
start_command = "gonk-agent-entrypoint"
prompt_mode = "flag"
prompt_flag = "--prompt"

[env]
# HOME MUST BE OVERRIDDEN HERE. Gas City's session passthrough allow-list
# (internal/processenv/provider.go) copies the CONTROLLER's HOME into every
# session pod -- and the controller's HOME is /home/gonk, an emptyDir that
# exists only in the controller pod. In an agent pod that path is not writable,
# so the session died instantly on
#     mkdir: cannot create directory '/home/gonk': Permission denied
# and the reconciler respawned it in a loop. Agent [env] beats the passthrough
# baseline (cityAnchoredSessionEnv applies providerEnv over it), so this is the
# place to fix it. /tmp is writable in the agent image for any uid.
HOME = "/tmp/gonk-home"
# ...AND THE XDG VARS, for the same reason and from the same leak. Overriding
# HOME alone is NOT enough: internal/processenv's allow-list also copies
# XDG_CONFIG_HOME (and friends) from the controller, where they point under
# /home/gonk. opencode is XDG-aware, so it ignored the corrected HOME and died on
#     EACCES: permission denied, mkdir '/home/gonk'
# from inside Bun -- with the overlay already rendered correctly, which made it
# look like a config problem when it was a home-directory problem. All four are
# pinned under the writable HOME so no XDG-aware tool in the image can be sent
# back to a path that does not exist in this pod.
XDG_CONFIG_HOME = "/tmp/gonk-home/.config"
XDG_DATA_HOME = "/tmp/gonk-home/.local/share"
XDG_CACHE_HOME = "/tmp/gonk-home/.cache"
XDG_STATE_HOME = "/tmp/gonk-home/.local/state"
# opencode's permission gate: "*" -> allow, so the session can run glab
# (read the issue, post the comment) without an interactive approval prompt.
OPENCODE_PERMISSION = '{"*":"allow"}'

# NOTE ON TURN/TOKEN CAPS: there is no [limits]/max_turns table on Gas City's
# Agent (verified against internal/config/config.go -- no such field exists,
# and inventing one here would be silently ignored by the loader, which is
# worse than not writing it: a cap nobody enforces). The deterministic caps
# the gate signal (spec 6.3) depends on -- "completed and posted required
# artifacts WITHIN TURN/TOKEN CAPS" -- are gonk-meter's PerTaskTokens budget
# (pkg/budget, Plan 03), enforced independently of this pack.
