# agents/pipefix/agent.toml -- THE DIRECTORY NAME ("pipefix") IS THE AGENT
# NAME. A `name` field here would be ignored by the loader (pack-spec.md
# 1.2.4). Do not add one and believe it.
#
# gonk-2usw plan 5.2: proposes a fix for ONE diagnosed pipeline failure, as
# typed effects (effect-shape.toml): exact-text `edit`s to files the dispatch
# allows plus one `fix_meta`, or one `scope_request` saying the fix needs more
# than it may change. IT READS; IT WRITES NOTHING. gonk-gate renders the prompt
# controller-side (cmd/gonk-gate/broker_pipefix_prompt.go), checks the batch
# (pkg/effects PlanFix), and it is the controller -- never this session -- that
# commits, opens the merge request and judges the result. The pod holds no
# forge credential and gets a checkout pinned to the commit the edits apply to.

description = "Proposes a small fix for a diagnosed pipeline failure as exact-text edits; reads the checkout, writes nothing."

# No model name here -- see agents/triage/agent.toml's comment; the same
# reasoning applies verbatim to every agent in this pack. Which rung this agent
# starts on is meter's business (pkg/rung LadderFloors), not the pack's.

min_active_sessions = 0

# --- The opencode harness -------------------------------------------------
# IDENTICAL to pack/agents/pipeline/agent.toml (which is triage's), and it must
# be: internal/packtest's TestPipefixPermissionMapIsPipelinesByteForByte fails
# on any drift. Every line is load-bearing and was established the hard way on
# triage -- read that file's comments before changing any of it.
start_command = "gonk-agent-entrypoint"
prompt_mode = "flag"
prompt_flag = "--prompt"

[env]
HOME = "/tmp/gonk-home"
XDG_CONFIG_HOME = "/tmp/gonk-home/.config"
XDG_DATA_HOME = "/tmp/gonk-home/.local/share"
XDG_CACHE_HOME = "/tmp/gonk-home/.cache"
XDG_STATE_HOME = "/tmp/gonk-home/.local/state"
# BYTE-IDENTICAL to agents/pipeline/agent.toml's line, compared as raw file
# bytes by internal/packtest. read/glob/grep stay allowed (the catch-all);
# bash, edit, webfetch, websearch, task and question are denied.
#
# WHY A FIX AGENT HAS NO EDIT TOOL AND NO SHELL (plan 5.1). It does not need
# either, and both would change the pod's threat model. Its untrusted input is
# the same as the pipeline agent's -- a job log written by whatever the
# pipeline ran -- plus repository content. So it PROPOSES each change as an
# `edit` effect (path, old, new) in its batch; the controller applies the
# edits to the blobs it read itself at the pinned commit, behind the scope
# gates, and the project's own pipeline on the merge request is the only
# thing that ever runs the result. `edit` denied also denies opencode's write,
# patch and multiedit tools, which are gated on the same permission.
#
# Like pipeline's, this set is reached by analogy with triage. Re-check it
# against the first real traces.
OPENCODE_PERMISSION = '{"*":"allow","bash":"deny","edit":"deny","webfetch":"deny","websearch":"deny","task":"deny","question":"deny","external_directory":{"*":"ask","/tmp/gonk-home/.local/share/opencode/tool-output/*":"allow","/tmp/opencode/*":"allow"}}'
