# pack/formulas/gonk-scaffold.toml
#
# ONE step, handed to the "scaffold" agent (pack/agents/scaffold/). Routed
# there by orders/gonk-scaffold.toml's `pool = "scaffold"`.
#
# spec 5.3: "a second, post-merge MR, generated by an agent session that reads
# the repo -- the first metered work". The artifact is a merge request from
# branch `gonk/scaffold`, so gonk-gate check for this trigger looks for the MR
# (check --artifact mr, source branch gonk/scaffold), not a comment.

formula = "gonk-scaffold"
description = "Scaffold .agent/ in {{project}} via a post-merge MR."

[requires]
formula_compiler = ">=2.0.0"

[vars]
project = ""
project_id = ""
rig = ""
issue_iid = ""
bead_anchor = ""
# See formulas/gonk-triage.toml's comment: NOT named `bead_id` -- that is a
# formulas v2 reserved variable name and any caller-supplied vars map
# containing it is rejected outright at instantiation.
city_bead_id = ""
session_key = ""
trigger = ""
config_hash = ""
rung = ""
model = ""
attempt = ""
reservation_id = ""
metadata_json = ""
key_secret_name = ""
key_secret_key = ""

[[steps]]
id = "scaffold"
title = "Scaffold .agent/ in {{project}}"
description = """
Read repository `{{project}}` and populate `.agent/` with durable project
context: what it is, how it is built and tested, and any conventions a
future triage or mention session needs to avoid guessing.

Create a branch named `gonk/scaffold` from the repository's default branch.
Open exactly one merge request from that branch whose description contains
this line, verbatim, on its own line:

<!-- gonk:bead:{{city_bead_id}} -->

Do not merge the MR yourself.
"""

[steps.metadata]
project_id = "{{project_id}}"
city_bead_id = "{{city_bead_id}}"
trigger = "{{trigger}}"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = "scripts/gonk-check.sh"
timeout = "2m"
