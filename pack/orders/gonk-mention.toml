# pack/orders/gonk-mention.toml
#
# The formula-order for the conversational surface (spec 5.5). Fired ONLY by
# gonk-dispatch, ONLY after /v1/policy/decide said `run`.
[order]
description = "Reply to an @gonk mention. Poured by gonk-dispatch after a budget decision."
formula = "gonk-mention"
trigger = "webhook"                   # fired via POST .../order/gonk-mention/run by
                                       # gonk-dispatch; the /run endpoint fires ONLY
                                       # webhook-trigger orders (manual is rejected 422).
pool = "mention"                      # see pack.toml's note on OD-2.
timeout = "20m"

# [order.params] REQUIRED for webhook orders at GASCITY_REF (supervisor rejects
# an empty block). Mirrors the vars gonk-gate dispatch passes. issue_iid is
# optional here (this trigger is not always issue-scoped).
[order.params]
project = { required = true }
project_id = { required = true }
rig = { required = true }
issue_iid = { required = false }
discussion_id = { required = false }
bead_anchor = { required = true }
city_bead_id = { required = true }
session_key = { required = true }
trigger = { required = true }
config_hash = { required = false }
rung = { required = false }
model = { required = false }
attempt = { required = false }
reservation_id = { required = false }
metadata_json = { required = false }
key_secret_name = { required = false }
key_secret_key = { required = false }
litellm_url = { required = false }
litellm_key = { required = false }
bot_token = { required = false }
