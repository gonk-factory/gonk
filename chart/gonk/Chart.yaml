apiVersion: v2
name: gonk
description: A local software factory for self-hosted GitLab — a Gas City pack plus glue.
type: application
# The CHART version. Bump on any chart change. It is not the app version.
version: 0.2.4
# The default app version. Image tags are set per-image and have no default
# (OD-1): a chart that renders and cannot pull is worse than one that refuses.
appVersion: "0.2.1"
kubeVersion: ">=1.28.0-0"
home: https://github.com/gonk-factory/gonk
sources:
  - https://github.com/gonk-factory/gonk
keywords: [gitlab, gascity, agents, llm, budgets]
maintainers:
  - name: Steve
    email: leftathome@gmail.com
annotations:
  # This chart deploys NO secrets and bundles NO third-party services. LiteLLM
  # and Gas City are BYO (OD-3, OD-4).
  gonk-factory.github.io/byo: "gitlab,litellm,gascity,postgres,prometheus,grafana"
  # IMAGE FLOORS (gonk-xsk3). The oldest build of each image this chart may be
  # rendered against; templates/_guards.tpl G23 refuses anything older. The
  # chart reaches the cluster before its images do, so a chart that starts
  # invoking something new (a subcommand, a flag, a probe) MUST raise the floor
  # of the image that provides it -- or it will run against an image without it,
  # which is the 2026-09-12 outage.
  #
  # RAISE A FLOOR ONLY TO A TAG THAT EXISTS: `hack/require_image_tags.py <tag>`.
  # The build number is what the render compares, and only the registry can
  # confirm that build number really belongs to that sha. Nothing offline checks
  # that the floor's build implements what the chart invokes: chart/IMAGE-CONTRACT
  # lists those invocations, and internal/buildgate fails when an image's lines
  # change against origin/main without that image's floor going up.
  #
  # This means a chart change that needs new binary behaviour is TWO pushes:
  # land the binary, let main's pipeline publish it, then raise the floor. If
  # you push both together, G23 holds the release -- safely -- until image
  # automation catches up.
  gonk-factory.github.io/image-floor.controller: v0.1.0-412.df764df9cea2
  gonk-factory.github.io/image-floor.intake: v0.1.0-343.a434b6fb3cac
  gonk-factory.github.io/image-floor.meter: v0.1.0-343.a434b6fb3cac
