{{- if .Values.gascity.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
# NAMESPACED Role, NEVER a ClusterRole. A ClusterRole would let a compromised
# controller reach agent pods in EVERY namespace -- exactly the blast radius this
# must not have. Verbs transcribed from docs/environment.md (read off Gas City's
# source): the k8s session provider creates/execs/logs agent SESSION pods and
# reads/writes the ConfigMaps that carry per-session state. Least privilege --
# nothing beyond pods, pods/exec, pods/log, configmaps.
kind: Role
metadata:
  name: gc-controller
  labels:
    {{- include "gonk.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
{{- end }}
