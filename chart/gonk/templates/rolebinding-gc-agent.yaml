{{- if .Values.gascity.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gc-agent
  labels:
    {{- include "gonk.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gc-agent
subjects:
  - kind: ServiceAccount
    name: gc-agent
    namespace: {{ .Release.Namespace }}
{{- end }}
