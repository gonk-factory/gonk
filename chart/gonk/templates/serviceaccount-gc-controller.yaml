{{- if and .Values.gascity.enabled .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gc-controller
  labels:
    {{- include "gonk.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The controller's k8s session provider creates/execs/logs agent SESSION pods and
# reads/writes ConfigMaps, so it needs an API token (Role: role-gc-controller.yaml).
automountServiceAccountToken: true
{{- end }}
