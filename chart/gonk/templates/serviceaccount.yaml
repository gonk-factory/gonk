{{/*
  The chart-level ServiceAccount (values.yaml's top-level `serviceAccount`
  block). Component workloads (gonk-meter, the Gas City controller/agent) get
  their OWN named ServiceAccounts in later tasks (Task 3/4/6.5) because their
  RBAC needs differ; this one exists so the scaffold has an identity to attach
  chart-wide annotations to (e.g. an IRSA-style annotation on a cloud cluster)
  without every component needing its own copy of `serviceAccount.annotations`.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gonk.fullname" . }}
  labels:
    {{- include "gonk.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
