{{- if and .Values.networkPolicy.enabled .Values.intake.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gonk-intake
  labels:
    {{- include "gonk.labels" . | nindent 4 }}
    app.kubernetes.io/component: intake
  annotations:
    {{- include "gonk.networkPolicyBanner" . | nindent 4 }}
spec:
  # ENFORCED ONLY WHERE THE CLUSTER'S NETWORK PLUGIN IMPLEMENTS NetworkPolicy.
  # The API server accepts this object either way; on a CNI that does not
  # implement it, this object blocks nothing. `helm test` reports which you
  # have. See chart/gonk/README.md, section 0.
  podSelector:
    matchLabels:
      {{- include "gonk.selectorLabels" (dict "ctx" . "component" "intake") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # The webhook, from the ingress controller only.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.namespaceSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.intake.ports.public }}
    # The private listener, from Prometheus (metrics, health).
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.prometheus.namespaceSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.intake.ports.private }}
    # The private listener, from the two pods that use the per-session checkout
    # (pkg/rig, gonk-msz): gonk-gate in the controller REGISTERS it
    # (POST /rig/{alias}) and the agent session pod FETCHES it
    # (GET /rig/{alias}.tar.gz).
    #
    # THIS IS THE INGRESS HALF OF TWO RULES THAT ALREADY EXISTED (gonk-nax7).
    # gonk-agent and gonk-controller have each allowed EGRESS to this port since
    # the checkout was built, and nothing here admitted either of them, so on a
    # cluster that enforces NetworkPolicy both calls were dropped on the way in
    # and every session ran with no working copy. A permission between two pods
    # in this namespace is two rules; TestEveryInNamespaceRuleHasItsOtherHalf
    # fails when either is edited alone.
    #
    # WHAT ELSE THIS ADMITS, because a NetworkPolicy cannot tell one path or
    # method from another: EVERYTHING on the private listener is reachable from
    # an agent session pod, a pod that runs text written by whoever opened the
    # issue. That is the unauthenticated POST /admin/reconcile, and it is the
    # REGISTRATION route itself: POST /rig/{alias} is not authenticated either
    # (pkg/rig/http.go), so a session pod can register a checkout of any
    # project the forge token can read, and then fetch it. The policy cannot
    # close that. Authenticating the registration, or serving the fetch on a
    # listener of its own, would; until then a session is confined to its own
    # project by the agent's instructions and not by the network. On a cluster
    # that does not enforce NetworkPolicy this was already the case.
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.agentPodSelector | nindent 14 }}
        {{- if .Values.gascity.enabled }}
        - podSelector:
            matchLabels:
              {{- include "gonk.selectorLabels" (dict "ctx" . "component" "controller") | nindent 14 }}
        {{- else }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.gascity.namespaceSelector | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.intake.ports.private }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 14 }}
      ports:
        {{- range .Values.networkPolicy.dns.ports }}
        - protocol: UDP
          port: {{ . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    # GitLab.
    {{- if .Values.networkPolicy.gitlabInCluster.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.gitlabInCluster.namespaceSelector | nindent 14 }}
    {{- else }}
    - to:
        {{- range .Values.networkPolicy.gitlab.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.gitlab.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    # gonk-meter (register projects, read state).
    - to:
        - podSelector:
            matchLabels:
              {{- include "gonk.selectorLabels" (dict "ctx" . "component" "meter") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.meter.port }}
    # The Gas City supervisor (fire orders), at GONK_SUPERVISOR_URL. Split the
    # same way gonk-meter's controller INGRESS is split, and for the same
    # reason -- the URL is derived, so the rule must follow it:
    #   * bundled controller -> in THIS namespace (component: controller), on
    #     gascity.supervisorPort. The gascity namespaceSelector below names a
    #     namespace the bundled controller does not live in, on a port it does
    #     not listen on, so it permitted NOTHING the bundled default actually
    #     dials: a webhook could never become a session. The controller's own
    #     policy has admitted intake on that port since it was written; this is
    #     the outbound half that was never written with it (gonk-zjk7).
    #   * BYO controller     -> the gascity namespaceSelector/ports.
    {{- if eq .Values.gascity.dispatch "http" }}
    {{- if .Values.gascity.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "gonk.selectorLabels" (dict "ctx" . "component" "controller") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.gascity.supervisorPort }}
    {{- else }}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.gascity.namespaceSelector | nindent 14 }}
      ports:
        {{- range .Values.networkPolicy.gascity.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
