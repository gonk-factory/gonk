{{- if and .Values.gascity.enabled .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gc-agent
  labels:
    {{- include "gonk.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The identity the controller assigns to the agent SESSION pods it spawns
# (agent_service_account = gc-agent). Its Role is pods:[get] ONLY -- an agent must
# never create/exec/delete pods. THE CHART DOES NOT CREATE THE AGENT PODS; it
# provisions the SA/Role they run under so their footprint is least-privilege.
{{- end }}
