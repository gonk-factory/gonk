{{- /*
Does THIS cluster enforce the gonk-agent egress policy?

The chart declares six NetworkPolicies. The API server accepts them whether or
not any controller implements them -- which is exactly how gonk ran for months
with policies that blocked nothing, on a cluster whose CNI is flannel. That is a
property of the CLUSTER, not of the chart, so the chart ships the instrument
alongside the claim and the operator does not have to take the README's word.

A HELM TEST HOOK, NOT AN INSTALL HOOK. An install hook that failed would block
the release, and on a cluster with no policy controller this SHOULD fail -- the
chart must still install there. `helm test` is explicit to invoke and cannot
wedge a release.

SAFE UNDER FLUX, verified in source rather than assumed: helm-controller sets
DefaultDataFilters = []DataFilter{IgnoreHookTestEvents} (internal/release/
observation.go), commented "To prevent manual test triggers from a user to
interfere with the checksum", so `helm test` creates no revision and provokes no
reconcile. Hooks are also absent from rel.Manifest, so driftDetection ignores
this pod. Do NOT switch this to Flux's spec.test.enable: Flux treats a test
failure as a RELEASE failure subject to remediation, and this release sets
remediateLastFailure and cleanupOnFail -- so on a cluster where the probe
correctly fails, enabling it would roll back or uninstall gonk every reconcile.
*/ -}}
{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.enforcementProbe.enabled .Values.intake.enabled }}
apiVersion: v1
kind: Pod
metadata:
  {{- /* Service names in this chart are literal, not fullname-prefixed
      (service-gonk-intake-internal.yaml et al), so this matches them. */}}
  name: gonk-netpol-probe
  labels:
    {{- include "gonk.labels" . | nindent 4 }}
    app.kubernetes.io/component: netpol-probe
    {{- /*
    The probe must carry EXACTLY the labels the gonk-agent policy selects on,
    or it is testing nothing.

    AND NOTHING SESSION-SHAPED. Gas City's k8s provider lists
    app=gc-agent,status.phase=Running and skips only pods that have neither a
    `gc-session` label nor a `gc-session-name` annotation -- so this pod is in
    that query while it runs, and is excluded by one `continue` in a pinned
    upstream dependency. Never add a gc-session label or annotation here.
    internal/charttest asserts the selector labels are present and that no
    session marker is.
    */}}
    {{- toYaml .Values.networkPolicy.agentPodSelector | nindent 4 }}
  annotations:
    helm.sh/hook: test
    {{- /*
    before-hook-creation keeps the LAST run's pod for inspection, which is what
    you want when the answer is "not enforced" and somebody has to look. The
    cost is a lingering pod carrying the agent's labels; that is acceptable only
    because of the invariant above, which is why it is tested.
    */}}
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  {{- /* helm test's own default is 5m; bound the pod independently of it. */}}
  activeDeadlineSeconds: {{ .Values.networkPolicy.enforcementProbe.deadlineSeconds }}
  {{- /* The probe opens sockets. It needs no Kubernetes API access at all, and
      must not run as gc-agent, which holds pods:[get]. */}}
  serviceAccountName: default
  automountServiceAccountToken: false
  {{- with .Values.image.pullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: {{ include "gonk.image" (dict "ctx" . "image" .Values.intake.image) | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      args:
        - netpol-probe
        {{- /*
        THE ALLOW LEG MUST BE PERMITTED AT BOTH ENDS, and that is a narrower
        constraint than it looks. NetworkPolicy is enforced on egress AT THE
        SOURCE and on ingress AT THE DESTINATION, so a leg is only reachable if
        both say yes.
        
        meter:8080 is the one pair that qualifies: the agent policy permits
        egress to component=meter on 8080, and the meter policy permits ingress
        from app=gc-agent on 8080. Checked, not assumed.
        
        gonk-intake:9090 does NOT qualify, even though the agent's egress rule
        names it: the intake policy admits only the traefik and monitoring
        namespaces, so that egress rule is dead and a probe using it would report
        INCONCLUSIVE on a cluster that enforces correctly. That inconsistency is
        filed as its own bug; do not "fix" it by pointing this leg back at it.
        
        THE COST, stated because it weakens the design: there is no single pod
        with both a permitted and a forbidden port that is also ingress-permitted,
        so the two legs differ in POD as well as port. The allow leg still proves
        the probe has working networking and that policy permits something; it no
        longer isolates "ignores ports" from "ignores pods" on its own. The L3
        leg below is what preserves that distinction.
        */}}
        - -allow
        - {{ printf "gonk-meter:%d" (int .Values.meter.port) | quote }}
        - -deny
        - {{ printf "gonk-intake:%d" (int .Values.intake.ports.public) | quote }}
        {{- /*
        A pod the policy does not name at all, so a CNI that enforces WHICH PODS
        but ignores WHICH PORTS is distinguishable from one that enforces
        neither. Without this leg those two look identical.
        */}}
        - -deny-l3
        - {{ printf "gonk-controller:%d" (int .Values.gascity.supervisorPort) | quote }}
        - -settle-timeout
        - {{ .Values.networkPolicy.enforcementProbe.settleTimeout | quote }}
        - -dial-timeout
        - {{ .Values.networkPolicy.enforcementProbe.dialTimeout | quote }}
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
{{- end }}
