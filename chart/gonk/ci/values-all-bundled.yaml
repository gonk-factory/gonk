# Task 8.5 toggle-matrix profile: everything ENABLED, the whole bundled
# factory. This is the values-file equivalent of internal/charttest.Minimum()
# -- every required value with no safe default, and nothing else. It renders
# the controller + Dolt (beads) + intake + meter + the operator config
# together. ledger.backend stays at its only value (postgres) and
# ledger.postgres.mode stays at its default (shared), per the matrix in
# docs/superpowers/plans/2026-07-13-plan-05-chart.md Task 8.5.
# release-unit: every gonk image (controller, intake, meter, and the agent
# image the controller hands to session pods) deploys under ONE tag.
releaseTag: v0.1.0

intake:
  webhookPublicURL: https://gonk.example.test/hook/gitlab

gascity:
  # G22: a TEST public verify key -- the repo golden vector's real ed25519
  # pubkey (chart/gonk/smoke). Grant-gating on; the private half is the Secret
  # gonk-gc-write-key (secrets.gcWriteKey default), provisioned out of band.
  writeAuth:
    verifyKey: "k1:1hcioE4eYD4PsM66wVJ8oBErEfCTyNPt9Q/+ZT0drmk="

dolt:
  image:
    tag: 2.1.7

# gonk-t41: the work store is OFF in values.yaml (gonk-js99) and this is the
# "everything enabled" profile, so it is the golden that asserts the RENDERED
# work store: the DSN mount, the import step in bootstrap-city and the Postgres
# egress rule. values-default.yaml keeps the safe default (off).
workstore:
  enabled: true

# gonk-mfsr: the pod reaper is OFF in values.yaml (merging the chart must not be
# able to arm pod DELETION) and this is the "everything enabled" profile, so it
# is the golden that asserts the RENDERED reaper: GONK_POD_REAP_NAMESPACE on the
# controller and Role/RoleBinding gonk-gate-podreap. values-default.yaml keeps
# the safe default (off), which is what a merge deploys.
podReap:
  enabled: true

# REQUIRED: the chart has no default GitLab.
gitlab:
  url: https://gitlab.example.internal

litellm:
  externalURL: http://litellm.litellm.svc:4000

operatorConfig:
  instance:
    ladder: [qwen-local]
  rungs:
    - name: qwen-local
      kind: local
      model: stub-local
      est_cost_usd: 0
      est_tokens: 200K
      synthetic_usd_per_1m_tokens: 0.20

onboarding:
  defaultRung: qwen-local

# A render profile, not a deployment: its tags (v0.1.0) carry no build number,
# so the image-floor guard (G23, gonk-xsk3) cannot rank them and would refuse
# the render. Saying so here is the explicit opt-in that guard requires.
imageFloor:
  acceptUnrankedTags: true
