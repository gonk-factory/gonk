# Task 8.5 toggle-matrix profile: everything ENABLED, the whole bundled
# factory. This is the values-file equivalent of internal/charttest.Minimum()
# -- every required value with no safe default, and nothing else. It renders
# the controller + Dolt (beads) + intake + meter + the operator config
# together. ledger.backend stays at its only value (postgres) and
# ledger.postgres.mode stays at its default (shared), per the matrix in
# docs/superpowers/plans/2026-07-13-plan-05-chart.md Task 8.5.
intake:
  image:
    tag: v0.1.0
  webhookPublicURL: https://gonk.example.test/hook/gitlab

meter:
  image:
    tag: v0.1.0

gascity:
  # G22: a TEST public verify key -- the repo golden vector's real ed25519
  # pubkey (chart/gonk/smoke). Grant-gating on; the private half is the Secret
  # gonk-gc-write-key (secrets.gcWriteKey default), provisioned out of band.
  writeAuth:
    verifyKey: "k1:1hcioE4eYD4PsM66wVJ8oBErEfCTyNPt9Q/+ZT0drmk="
  image:
    tag: v0.1.0

dolt:
  image:
    tag: 2.1.7

litellm:
  externalURL: http://litellm.litellm.svc:4000

operatorConfig:
