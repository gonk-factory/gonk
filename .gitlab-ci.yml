# =============================================================================
# gonk CI.
#
# RUNNER REALITY (docs/environment.md): every GitLab runner on this cluster is
# OFFLINE, and no runner has ever executed a job for this repo -- the first
# images are built and pushed BY HAND (Makefile `push`). So this pipeline is
# written to be TRUE the day a runner lands, not to invent reach it does not
# have. Two consequences are baked in here:
#
#   * The Go gate is VENDORED + OFFLINE. GOFLAGS=-mod=vendor and GOPROXY=off are
#     global, so no job ever reaches a module proxy. `vendor/` is committed.
#   * Every job that needs podman, a network, or the registry (image build,
#     push, trivy scan, chart publish) is DOCUMENTED-MANUAL: `rules: when: never`
#     (or manual), with the real Makefile target it maps to. It does not run in
#     CI today; it is here so the mapping is not lost and so it turns on with a
#     single rule edit once a runner + registry credentials exist.
# =============================================================================

# Shared homelab CI: the kaniko image-build + helm-push templates and the
# cluster specifics (node pinning, the in-cluster registry Service,
# the zot pull-through mirror, pod sizing). This is the ESTABLISHED way images
# are built in CI on this cluster -- gonk consumes it rather than reinventing the
# unprivileged-kaniko dance. The `include` also merges that project's global
# `variables:` (INTERNAL_REGISTRY_REPO / INTERNAL_REGISTRY_HOST / ZOT_MIRROR /
# KUBERNETES_NODE_SELECTOR_HOSTNAME=<an amd64 build node> / pod sizing) into this pipeline.
# See homelab/ci-templates (on the maintainers' GitLab) /kaniko.yml.
include:
  - project: 'homelab/ci-templates'
    ref: main
    file: '/kaniko.yml'

stages: [lint, test, chart, images]

# -----------------------------------------------------------------------------
# A superseded pipeline cancels itself (gonk-7n2).
#
# MEASURED 2026-09-07: four commits in quick succession produced four pipelines
# and roughly 56 jobs. Image jobs serialise on `resource_group:
# gonk-images-$BUILD_ARCH` ACROSS pipelines, so the fourth -- the only one
# anybody wanted to deploy -- was still queued an hour later behind three
# pipelines building images for commits that had already been superseded.
# Getting it required cancelling those three BY HAND, which is a workaround, and
# an easy one to get backwards: cancel the pipeline whose images you actually
# need and you wait another hour.
#
# `conservative` cancels a superseded pipeline WHOLE, but only if no job with
# `interruptible: false` has started. `default: interruptible: true` below means
# no such job exists, so a superseded pipeline is always cancelled outright and
# reaches a TERMINAL state -- and reaching a terminal state is what releases the
# resource_group. That release is measured, not assumed: cancelling those three
# pipelines by hand on 2026-09-07 freed the group immediately and the wanted
# build started within the minute.
#
# `on_job_failure: all`: if one kaniko build fails, the tag set for that commit
# is incomplete and nothing can deploy it, so the other nine builds are an hour
# of build-node time spent on images no one can use. Stop the pipeline
# instead. Jobs with `allow_failure: true` -- the manual escape hatch in
# gonk_image_rules -- do not trigger this.
workflow:
  auto_cancel:
    on_new_commit: conservative
    on_job_failure: all

variables:
  # Vendored + offline: the standing local gate is exactly
  #   GOFLAGS=-mod=vendor GOPROXY=off go test ./... -race
  # (plan 01). Setting them globally makes every Go job identical to it and
  # guarantees no job silently reaches out to a proxy the runner cannot see.
  GOFLAGS: "-mod=vendor"
  GOPROXY: "off"

default:
  # Every job in this pipeline is safe to cancel mid-flight, which is the
  # precondition for the auto-cancel above. Nothing here mutates state outside
  # the registry, and the kaniko jobs push their --destination tag as the LAST
  # step: a cancelled build leaves NO $GONK_TAG-<arch> tag rather than a partial
  # one. The layers it may already have written to --cache-repo are
  # content-addressed and idempotent, so a half-warmed cache is just a cache.
  #
  # This is a `default:` rather than a keyword repeated on each job so that a NEW
  # job is interruptible without anyone having to remember. Under
  # `conservative`, one job that forgot would re-protect every superseded
  # pipeline it appeared in -- restoring exactly the hour-long queue this
  # removes, silently. internal/buildgate asserts that no job opts back out.
  interruptible: true

# -----------------------------------------------------------------------------
# The Go gate (plan 01). Unchanged in intent; now explicitly offline/vendored.
# -----------------------------------------------------------------------------
lint:
  stage: lint
  # Pin the full tag. Must be v2.x to match .golangci.yml, and must be built
  # with a Go >= go.mod's directive or it cannot compile the module at all.
  # v2.12.2 is built with go1.26.2, and is the same version as the local gate.
  image: golangci/golangci-lint:v2.12.2
  script:
    - golangci-lint run ./...

test:
  stage: test
  image: golang:1.26
  before_script:
    # REAL jq, not a stand-in. test/entrypoint runs images/agent/entrypoint.sh
    # as a real process, and that script uses jq for two things it cannot fake
    # its way through: parsing the fetched prompt document
    # (`jq -r '.prompt // empty'`, `.model`, `.metadata`, `.litellm_key`) and
    # BUILDING the webhook JSON with correct escaping (`jq -n --arg ...`,
    # which exists precisely because string concatenation gets embedded quotes
    # wrong). golang:1.26 is Debian-based and ships no jq, so
    # TestPromptFetchRetriesTransportFailureThenSucceeds died with
    # `entrypoint.sh: 278: jq: not found`, exit 127 (job 22185) -- while
    # passing on GitHub, whose runners ship jq.
    #
    # A fake jq on the test's fakebin PATH was the alternative and is the
    # wrong call: it would have to reimplement jq's filter language and its
    # escaping, and a fake that diverges from real jq makes the test go green
    # on behaviour production does not have -- worse than the red it replaces.
    # test/entrypoint/fakepath_harness_test.go's fakePATH is explicit that jq,
    # like mkdir/tar/sed, is meant to resolve to the real system tool; only
    # opencode and curl are faked. Installing it also keeps Lab and Hub
    # testing the same thing, which is the drift that caused this.
    - apt-get update -qq && apt-get install -y --no-install-recommends jq
    - jq --version
    # THE RELEASED STATE, for internal/buildgate's chart/IMAGE-CONTRACT check
    # (gonk-xsk3): an image whose chart invocations changed against main must
    # have a raised floor, and that comparison needs main. The runner clones one
    # branch, so origin/main is absent on a feature-branch pipeline and the test
    # goes RED rather than quietly comparing against HEAD.
    #
    # The explicit refspec is REQUIRED: `git fetch --depth=1 origin main` updates
    # FETCH_HEAD only and creates no refs/remotes/origin/main (measured
    # 2026-09-17). On a main pipeline this fetches what is already checked out,
    # so the base is HEAD's own commit and the floor rules have nothing to
    # compare -- that is stated in docs/plans/2026-09-13-chart-image-floor.md.
    - git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main
  script:
    - go vet ./...
    # Every custom //go:build tag, type-checked -- the same list the Makefile's
    # VET_BUILD_TAGS and ci.yml's `go vet (every custom build tag)` step carry.
    # An untagged `go vet ./...` compiles none of these files. It is the ONLY
    # honest coverage `testclock` can have: it guards no _test.go file, it
    # swaps the meter's clock for e2e (gonk-0bvc).
    - for t in chart component images integration live testclock; do
        echo "go vet -tags $t ./...";
        go vet -tags "$t" ./... || exit 1;
      done
    # NO -skip, deliberately, and none may ever be added here. This bare
    # command is what made TestEveryBuildTagRunsInCI's T-14 exclusion visible:
    # the skip went into the Makefile and into ci.yml but not here, so this
    # pipeline was red for hours while Hub was green. The fix was to make the
    # test pass and drop the skip from all three, not to add a fourth copy of
    # it (delivery plan rule 4b: a red gate is never acceptable, and neither
    # is a green one that stopped asking).
    # -shuffle=on: see the Makefile's `test` target (gonk-5pyx). A failure
    # prints `-test.shuffle <seed>`; -shuffle=<seed> reproduces the order.
    - go test ./... -race -count=1 -shuffle=on

# -----------------------------------------------------------------------------
# The export check (gonk-cuwn): nothing internal may come back.
#
# What is published is the tree of a commit minus a list of internal-only
# paths. `make gate` (and the `test` job above, through internal/buildgate)
# already applies the deny-pattern guard to the working tree. These two jobs
# run the EXPORT'S OWN commands on the commit, on every pipeline, so a branch
# that would make the next release fail is red before it merges:
#
#   export-check  the public tree of $CI_COMMIT_SHA, built by hack/relexport
#                 from a clone, through the deny-pattern guard AND the pinned
#                 secret scanner. Zero findings or the job fails.
#   export-gate   writes that public tree into a directory and runs the gate's
#                 Go half INSIDE it: the published tree must build, vet and
#                 pass its own tests with the internal-only paths gone.
#
# The secret scanner is gitleaks, the release the public `secrets` workflow
# pins, fetched as that release's archive and refused unless its sha256 is the
# pinned one (internal/buildgate holds the two pins equal). The archive comes
# from the scanner's public release page; a runner without that egress sets the
# CI/CD variable GITLEAKS_ARCHIVE_URL to a mirror of the SAME archive. A
# download that fails, or a digest that differs, fails the job: the scanner
# half is never skipped quietly.
# -----------------------------------------------------------------------------
export-check:
  stage: test
  image: golang:1.26
  variables:
    GITLEAKS_ARCHIVE_URL: "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
    GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  script:
    - curl -fsSL -o /tmp/gitleaks.tar.gz "$GITLEAKS_ARCHIVE_URL"
    - echo "$GITLEAKS_ARCHIVE_SHA256  /tmp/gitleaks.tar.gz" | sha256sum -c -
    - tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
    # The tool works in a clone of a BRANCH, never in a working tree; the
    # runner checks out a detached commit, so name it.
    - git branch -f export-check "$CI_COMMIT_SHA"
    - go run ./hack/relexport check --origin "$CI_PROJECT_DIR" --branch export-check --src "$CI_COMMIT_SHA" --gitleaks /tmp/gitleaks

export-gate:
  stage: test
  image: golang:1.26
  # Every commit on the default branch; on any other branch, on demand.
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
  before_script:
    # The same real jq the `test` job installs, for the same tests.
    - apt-get update -qq && apt-get install -y --no-install-recommends jq
  script:
    - git branch -f export-gate "$CI_COMMIT_SHA"
    - go run ./hack/relexport write --origin "$CI_PROJECT_DIR" --branch export-gate --src "$CI_COMMIT_SHA" --dir /tmp/public-tree
    # As a repository of its own, the way a contributor has it: one commit,
    # which is also the released state the image-contract check compares with.
    - cd /tmp/public-tree
    - git init --quiet --initial-branch=main
    - git add --all --force
    - git -c user.name=export-gate -c user.email=export-gate@example.invalid commit --quiet -m "the public tree of $CI_COMMIT_SHA"
    - git update-ref refs/remotes/origin/main HEAD
    - test -z "$(git status --porcelain)"
    # The Makefile's own targets, so this job cannot drift from the gate.
    - make toolchain vet guard test

# -----------------------------------------------------------------------------
# The chart gate.
# -----------------------------------------------------------------------------
chart-lint:
  stage: chart
  # Only needs helm. Pin the tag: helm's schema validation has changed behaviour
  # across minors before. Lints ALL EIGHT ci/ profiles (the four Task 9 plus the
  # four Task 8.5 toggle-matrix profiles), because the golden gate snapshots all
  # eight and a profile that renders but does not lint is a profile that ships broken.
  # entrypoint: [""] is REQUIRED (gonk-pk1z): alpine/helm's ENTRYPOINT is
  # `helm`, and the docker executor does not override it, so `sh -c script`
  # ran as `helm sh -c ...` -> 'unknown command "sh"'. Guarded by
  # internal/buildgate/ci_entrypoint_test.go.
  image:
    name: alpine/helm:3.19.0
    entrypoint: [""]
  script:
    - for p in default byo-everything cnpg full-monitoring all-bundled external-dolt byo-gascity ledger-cnpg; do
        echo "== helm lint --strict ci/values-$p.yaml ==";
        helm lint --strict chart/gonk --values chart/gonk/ci/values-$p.yaml;
      done

chart-test:
  stage: chart
  # OWNER DECISION (OD-7): this image needs go + helm + kubeconform. Until it
  # exists, this job does not run and the chart gate is LOCAL -- which is where
  # plan 01's gate already lives (PLAN.md: no runner has ever executed a job).
  # The gate itself, run locally, is:
  #   go test -tags chart ./internal/charttest/... -count=1
  # It re-renders every profile, diffs the golden manifests, helm-lints, and
  # kubeconform -strict validates (CRDs against chart/gonk/tests/crd-schemas,
  # NOT -ignore-missing-schemas).
  image: $GONK_CHART_TOOLS_IMAGE
  rules:
    - if: $GONK_CHART_TOOLS_IMAGE
  script:
    - go test -tags chart ./internal/charttest/... -count=1

# -----------------------------------------------------------------------------
# The no-latest gate. This one CAN run in an offline runner: it is a pure-shell
# grep (Makefile `no-latest`), no podman, no network, no registry. `latest` is
# banned everywhere (docs/environment.md); Renovate cannot bump a floating tag.
# -----------------------------------------------------------------------------
no-latest:
  stage: images
  image: alpine:3.20
  script:
    - apk add --no-cache make grep
    - make no-latest

# -----------------------------------------------------------------------------
# Image build + push, IN CI, via unprivileged kaniko (homelab/ci-templates).
#
# HISTORY: the first gonk-controller/intake/meter images were built + pushed BY
# HAND (Makefile `push`) because every runner was offline and no runner had ever
# executed a job. That era is over -- a runner is online and pipelines are green,
# so images now build in CI. The k8s executor is `privileged = false` (no DinD),
# which is exactly what kaniko is for: it builds a Dockerfile in userspace and
# pushes straight to the in-cluster registry Service over plain HTTP (bypassing
# the Traefik ingress' blob-PATCH timeout and the private CA the executor
# pods don't mount). Auth is the CI job token -- the internal registry IS this
# GitLab's integrated registry, so $CI_REGISTRY_USER/$CI_REGISTRY_PASSWORD push
# to $CI_PROJECT_PATH with no deploy token.
#
# TAGGING stays gonk's convention, NOT the shared template's (sha8 + `latest`).
# The shape and the reasoning are in THE TAG block below; it is computed in
# exactly one place and referenced from all three sites that need it (the
# kaniko legs, the index jobs, the testclock index). Three copies of a tag
# computation is how a mismatched set ships: an index published over per-arch
# tags that were pushed under a different name.
# `latest` is never pushed (G11 + the no-latest gate reject it on principle).
#
# The build-args come from images/versions.env (sourced in before_script), so CI
# and the Makefile read the exact same pins. The testclock meter is built with
# BUILD_TAGS=testclock to a SEPARATE `-testclock` tag and is NEVER the plain
# meter tag (a clock a file can move must never ship as production).
# -----------------------------------------------------------------------------
# THE TAG. One definition, referenced three times.
#
#   default branch:      $GONK_VERSION-$CI_PIPELINE_IID.<sha12>  v0.1.0-2493.068658298d09
#   any other branch:    $GONK_VERSION-<sha12>                   v0.1.0-068658298d09
#
# WHY THE SPLIT. Flux image automation has to answer "which of these tags is
# the newest", and the only way it can is by RANKING them -- semver, numerical
# or alphabetical. A git sha carries no ordering at all, so against the old
# tags "newest" means the alphabetically-greatest hash, which is an arbitrary
# old commit. A pipeline IID only ever goes up, so $GONK_VERSION-<iid>.<sha>
# ranks correctly and still names the exact commit it was built from.
#
# CI_PIPELINE_IID, NOT CI_PIPELINE_ID. The IID counts pipelines of THIS project
# (1, 2, 3, ...); the ID is a GitLab-instance-wide row id shared with every
# other project on the box. Both increase, but the ID jumps by however many
# pipelines unrelated projects happened to run in between -- an unreadable
# number that ties gonk's image names to traffic that has nothing to do with
# gonk. Neither number is a version; both are only ever compared.
#
# WHY NON-DEFAULT BRANCHES KEEP THE OLD, UNRANKABLE SHAPE. The image rules
# below fire on ANY branch. If a feature branch published a ranked tag it would
# carry a HIGHER number than main's most recent build -- main's images are only
# rebuilt when main changes -- and image automation would deploy branch code to
# the cluster. Leaving branch builds on the sha-only shape makes that
# impossible AT THE SOURCE: an ImagePolicy whose filterTags requires the
# `<iid>.<sha>` form cannot match a branch build, so the property does not
# depend on a rule that somebody could later widen. Branch images stay in the
# registry and stay pullable by hand, which is what they are for.
#
# THE POLICY THAT CONSUMES THIS (gitops, not in this repo):
#   filterTags:
#     pattern: '^v(?P<ver>\d+\.\d+\.\d+)-(?P<build>\d+)\.[0-9a-f]{12}$'
#     extract: '$build'
#   policy:
#     numerical: {order: asc}
# Anchored at both ends on purpose: that is what rejects the per-arch legs
# ($GONK_TAG-amd64 / -arm64), the testclock meter ($GONK_TAG-testclock) and
# every legacy v0.1.0-<sha12> tag already sitting in the registry. Ranking on
# the extracted <iid> is numeric and total; ranking the whole tag as a semver
# prerelease also works, but a sha12 that happens to be all digits with a
# leading zero is not a legal semver numeric identifier, and numerical+extract
# has no such edge.
#
# A PIPELINE RETRY reuses the same IID and so republishes the identical tag
# over identical content: the per-arch legs are rewritten with the same digest
# and the index job re-merges the index over them. That is not the gonk-9ub
# hazard -- that one is a by-HAND single-arch `make push` replacing a
# multi-arch index. Nothing in CI writes the unsuffixed tag except the index
# jobs, and they always write an index.
.gonk-tag:
  before_script:
    # Same pins the Makefile uses -- one source of truth (images/versions.env).
    - &gonk_tag_script |
      set -a; . images/versions.env; set +a
      GONK_SHA12=$(printf %s "$CI_COMMIT_SHA" | cut -c1-12)
      if [ -n "$CI_PIPELINE_IID" ] && [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        export GONK_TAG="${GONK_VERSION}-${CI_PIPELINE_IID}.${GONK_SHA12}"
      else
        export GONK_TAG="${GONK_VERSION}-${GONK_SHA12}"
      fi
      echo "GONK_TAG=$GONK_TAG"
# -----------------------------------------------------------------------------
# Arch legs. Each builds NATIVELY on a node of its own arch (see
# homelab/ci-templates!1 for why emulation is not an option here: no binfmt
# DaemonSet, and rootless BuildKit needs pod annotations the runner will not
# let a job overwrite). Per-arch images are pushed as $GONK_TAG-<arch>; the
# *-index jobs publish the real $GONK_TAG as an OCI index over them.
.gonk-kaniko:
  stage: images
  variables:
    BUILD_ARCH: "amd64"
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [""]
  # Build images ONLY when something that can change an image changed.
  #
  # WHY (gonk-1t4, measured 2026-08-13): this used to be a bare
  # `- if: '$CI_COMMIT_BRANCH'`, so every commit ran ten kaniko builds and five
  # index jobs. 61 of the 87 commits between 2026-07-30 and 2026-08-13 -- 70% --
  # touched no file below: bead updates, chart edits, docs, gitops notes. They
  # each published five new image tags plus a pile of kaniko cache layers, which
  # is how agentic/gonk-project reached 183 GB of a 294 GB registry and filled
  # the volume (gonk-mzm).
  #
  # DELIBERATELY COARSE -- one shared list for all five images, not per-image
  # rules. The Go binaries all share pkg/ + internal/ + vendor/, so per-image
  # granularity would buy maybe another tenth while adding a way to ship a STALE
  # image. That is this project's signature failure mode (a step that silently
  # did nothing and looked exactly like success), and it is not worth a tenth.
  # Rebuild all five, or none.
  #
  # KNOW THIS BEFORE YOU DEPLOY: a commit touching none of these paths now
  # produces NO image, so NO tag naming that commit exists in the registry.
  # Deploy the tag of the most recent commit that did build. `git log` against
  # this list tells you which one that is -- or, now that main's tags rank,
  # let the ImagePolicy pick the highest build number, which is the same thing.
  #
  # RELEASE-UNIT v2 RELIES ON THIS. A code commit on main builds all four
  # release images at ONE tag; a docs commit builds none. So gitops follows a
  # single ImagePolicy (on gonk-controller, published LAST -- see
  # controller-index) and a docs commit does not move dev at all. The list is
  # anchored (&gonk_image_inputs) so deployable-image-guard runs on exactly the
  # pipelines that build.
  rules: &gonk_image_rules
    - if: '$CI_COMMIT_BRANCH'
      changes: &gonk_image_inputs
        - go.mod
        - go.sum
        - vendor/**/*
        - cmd/**/*
        - internal/**/*
        - pkg/**/*
        - images/**/*      # Dockerfiles, versions.env, entrypoint.sh
        - pack/**/*        # COPY pack/ /opt/gonk/pack/ in Dockerfile.controller
        - .gitlab-ci.yml   # the build definition itself
    # Escape hatch: build any commit on demand without editing this file.
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
  # Serialize the image builds: the template pins every job to one amd64 build node, and
  # five parallel kaniko pods there would contend for memory. One at a time gives
  # each build that node's full headroom (and warms the shared layer cache in order).
  # Per-ARCH so the amd64 and arm64 pools do not serialise against each other:
  # they run on different nodes and contend for nothing.
  resource_group: gonk-images-$BUILD_ARCH
  before_script:
    # An arm64 leg with no placement stops here, loudly (see .gonk-arm64).
    - &gonk_arm64_placement_guard |
      if [ "$BUILD_ARCH" = "arm64" ]; then
        if [ -z "$GONK_ARM64_NODE_SELECTOR" ]; then
          echo "FATAL: CI/CD variable GONK_ARM64_NODE_SELECTOR is empty; the arm64 legs have no node to build on. Define it in the project's CI/CD settings (not Protected)." >&2
          exit 1
        fi
        if [ -z "$GONK_ARM64_TOLERATION" ]; then
          echo "FATAL: CI/CD variable GONK_ARM64_TOLERATION is empty; an empty toleration overwrite tolerates EVERY taint. Define it in the project's CI/CD settings (not Protected)." >&2
          exit 1
        fi
      fi
    - *gonk_tag_script
    - mkdir -p /kaniko/.docker
    # Job-token auth for both the external registry name and the internal Service
    # hostname kaniko actually dials -- same JWT realm either way.
    - |
      AUTH=$(printf %s "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"},"%s":{"auth":"%s"}}}' \
        "$CI_REGISTRY" "$AUTH" "$INTERNAL_REGISTRY_HOST" "$AUTH" \
        > /kaniko/.docker/config.json

agent-image-amd64:
  tags: [cluster]
  extends: .gonk-kaniko
  script:
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/images/Dockerfile.agent"
      --destination "$INTERNAL_REGISTRY_REPO/gonk-agent:$GONK_TAG-$BUILD_ARCH"
      --custom-platform=linux/$BUILD_ARCH
      --build-arg TARGETARCH=$BUILD_ARCH
      --build-arg GONK_TAG=$GONK_TAG
      --build-arg GO_VERSION=$GO_VERSION
      --build-arg DEBIAN_BASE=$DEBIAN_BASE
      --build-arg OPENCODE_VERSION=$OPENCODE_VERSION
      --cache=true
      --cache-repo="$INTERNAL_REGISTRY_REPO/cache"
      --compressed-caching=false
      --registry-mirror=$ZOT_MIRROR
      --insecure-registry=$ZOT_MIRROR
      --insecure-registry=$INTERNAL_REGISTRY_HOST
      --skip-tls-verify

controller-image-amd64:
  tags: [cluster]
  extends: .gonk-kaniko
  script:
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/images/Dockerfile.controller"
      --destination "$INTERNAL_REGISTRY_REPO/gonk-controller:$GONK_TAG-$BUILD_ARCH"
      --custom-platform=linux/$BUILD_ARCH
      --build-arg TARGETARCH=$BUILD_ARCH
      --build-arg GONK_TAG=$GONK_TAG
      --build-arg GO_VERSION=$GO_VERSION
      --build-arg DEBIAN_BASE=$DEBIAN_BASE
      --build-arg BD_VERSION=$BD_VERSION
      --build-arg DOLT_VERSION=$DOLT_VERSION
      --build-arg GASCITY_REF=$GASCITY_REF
      --cache=true
      --cache-repo="$INTERNAL_REGISTRY_REPO/cache"
      --compressed-caching=false
      --registry-mirror=$ZOT_MIRROR
      --insecure-registry=$ZOT_MIRROR
      --insecure-registry=$INTERNAL_REGISTRY_HOST
      --skip-tls-verify

# NO LAYER CACHE, deliberately -- and the same for both meter jobs below.
#
# Kaniko caches RUN layers, keyed on the layer's command PLUS the contents of
# everything COPYed before it. Dockerfile.intake and Dockerfile.meter have
# exactly one RUN in the build stage (`go build`), and it sits after
# `COPY cmd/ internal/ pkg/`. The source changes on every commit that builds at
# all, so that key is different every time: the cache could never hit. It was
# still PUSHED every build, and gonk-meter pushed twice per arch (plain +
# testclock). That is a pure write of layers nothing would ever read.
#
# Measured 2026-08-13 (gonk-1t4): agentic/gonk-project/cache held 139 GB across
# 1296 tags -- on its own, nearly half the 294 GB registry, and the direct cause
# of the volume filling (gonk-mzm).
#
# gonk-agent and gonk-controller KEEP their cache: those genuinely do have
# stable, expensive RUN layers ahead of any source COPY -- the pinned gascity
# clone, the apt installs, and the checksum-verified opencode/glab/bd/dolt
# fetches, all keyed on images/versions.env rather than on the working tree.
intake-image-amd64:
  tags: [cluster]
  extends: .gonk-kaniko
  script:
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/images/Dockerfile.intake"
      --destination "$INTERNAL_REGISTRY_REPO/gonk-intake:$GONK_TAG-$BUILD_ARCH"
      --custom-platform=linux/$BUILD_ARCH
      --build-arg TARGETARCH=$BUILD_ARCH
      --build-arg GONK_TAG=$GONK_TAG
      --build-arg GO_VERSION=$GO_VERSION
      --build-arg DISTROLESS_BASE=$DISTROLESS_BASE
      --registry-mirror=$ZOT_MIRROR
      --insecure-registry=$ZOT_MIRROR
      --insecure-registry=$INTERNAL_REGISTRY_HOST
      --skip-tls-verify

meter-image-amd64:
  tags: [cluster]
  extends: .gonk-kaniko
  script:
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/images/Dockerfile.meter"
      --destination "$INTERNAL_REGISTRY_REPO/gonk-meter:$GONK_TAG-$BUILD_ARCH"
      --custom-platform=linux/$BUILD_ARCH
      --build-arg TARGETARCH=$BUILD_ARCH
      --build-arg GONK_TAG=$GONK_TAG
      --build-arg GO_VERSION=$GO_VERSION
      --build-arg DISTROLESS_BASE=$DISTROLESS_BASE
      --registry-mirror=$ZOT_MIRROR
      --insecure-registry=$ZOT_MIRROR
      --insecure-registry=$INTERNAL_REGISTRY_HOST
      --skip-tls-verify

# The e2e-only testclock meter: SAME Dockerfile, BUILD_TAGS=testclock, a distinct
# `-testclock` tag. Never the plain meter tag (Makefile meter-testclock-image;
# test/images/servers_smoke_test.go asserts the two images differ exactly here).
meter-testclock-image-amd64:
  tags: [cluster]
  extends: .gonk-kaniko
  script:
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/images/Dockerfile.meter"
      --destination "$INTERNAL_REGISTRY_REPO/gonk-meter:$GONK_TAG-testclock-$BUILD_ARCH"
      --custom-platform=linux/$BUILD_ARCH
      --build-arg TARGETARCH=$BUILD_ARCH
      --build-arg GONK_TAG=$GONK_TAG
      --build-arg GO_VERSION=$GO_VERSION
      --build-arg DISTROLESS_BASE=$DISTROLESS_BASE
      --build-arg BUILD_TAGS=testclock
      --registry-mirror=$ZOT_MIRROR
      --insecure-registry=$ZOT_MIRROR
      --insecure-registry=$INTERNAL_REGISTRY_HOST
      --skip-tls-verify

# -----------------------------------------------------------------------------
# arm64 legs + index publication.
#
# The arm64 leg of each image, and then the job that publishes the REAL tag
# ($GONK_TAG, no arch suffix) as an OCI image index over the two legs. Nothing
# should ever deploy a $GONK_TAG-<arch> tag directly -- those exist only as
# index inputs.
#
# Why native legs rather than one emulated multi-platform build: emulation needs
# a privileged binfmt DaemonSet (this cluster has none) and rootless BuildKit
# wants pod annotations the runner will not let a job overwrite. See
# homelab/ci-templates!1.
# -----------------------------------------------------------------------------
.gonk-arm64:
  variables:
    BUILD_ARCH: "arm64"
    KUBERNETES_NODE_SELECTOR_ARCH: "kubernetes.io/arch=arm64"
    # WHERE the arm64 legs run is a fact about one cluster, so it is not written
    # here: both values come from CI/CD variables defined on the PROJECT
    # (Settings > CI/CD > Variables), outside the repository. Neither may be
    # "Protected" -- image legs run on every branch.
    #
    #   GONK_ARM64_NODE_SELECTOR   label=value of the one arm64 node with
    #                              build-sized headroom (the others leave build
    #                              pods Pending)
    #   GONK_ARM64_TOLERATION      key=value:effect of the taint that node
    #                              carries; without tolerating it the pod selects
    #                              the node and never lands
    #
    # An EMPTY or undefined variable does not schedule the job somewhere else
    # quietly. The runner refuses an empty node-selector overwrite before any pod
    # exists (it is not `k=v`); an empty toleration it would ACCEPT -- as
    # "tolerate every taint" -- so the legs' own before_script (.gonk-kaniko,
    # *gonk_arm64_placement_guard) refuses to build with either one empty.
    KUBERNETES_NODE_SELECTOR_HOSTNAME: $GONK_ARM64_NODE_SELECTOR
    KUBERNETES_NODE_TOLERATIONS_GPU: $GONK_ARM64_TOLERATION

agent-image-arm64:
  tags: [cluster]
  extends: [agent-image-amd64, .gonk-arm64]

controller-image-arm64:
  tags: [cluster]
  extends: [controller-image-amd64, .gonk-arm64]

intake-image-arm64:
  tags: [cluster]
  extends: [intake-image-amd64, .gonk-arm64]

meter-image-arm64:
  tags: [cluster]
  extends: [meter-image-amd64, .gonk-arm64]

meter-testclock-image-arm64:
  tags: [cluster]
  extends: [meter-testclock-image-amd64, .gonk-arm64]

# GONK_TAG is computed, not static, so the tag overrides are exported in
# before_script (which shares a shell with the template's script:) rather than
# set as `variables:`.
.gonk-index:
  extends: .manifest-merge
  stage: images
  # THE SAME LIST as .gonk-kaniko, by anchor rather than by copy. An index job
  # that ran when its two arch legs did not would look for tags that were never
  # pushed; one that skipped when they did would leave a commit with per-arch
  # tags and no index, which is exactly the shape that took gonk down for six
  # days (gonk-n50). These two must not be able to drift.
  rules: *gonk_image_rules
  before_script:
    - *gonk_tag_script
    - export MULTIARCH_SOURCE_TAG="${MULTIARCH_SOURCE_TAG:-$GONK_TAG}"
    - export MULTIARCH_TAGS="${MULTIARCH_TAGS:-$GONK_TAG}"

agent-index:
  tags: [cluster]
  extends: .gonk-index
  needs: [agent-image-amd64, agent-image-arm64]
  variables:
    IMAGE: gonk-agent

# THE CONTROLLER IS PUBLISHED LAST (release-unit v2). gitops follows ONE
# ImagePolicy, on gonk-controller, and that one tag sets every gonk image
# (chart `releaseTag`). So the controller tag must not exist until the agent,
# intake and meter indexes at the SAME name already do: otherwise Flux can move
# dev to a tag the other three lack -- ImagePullBackOff, the 2026-09-07 shape.
# Without this `needs:` the order was whatever the resource_group happened to
# produce: pipeline IID 499 published controller-index at 03:34:20, intake at
# 03:37:40 and meter at 03:42:55.
#
# If any of those three fails, this job never runs (and `on_job_failure: all`
# cancels it outright), so the controller tag is never published and dev does
# not move. All five index jobs share *gonk_image_rules, so this `needs:` never
# points across a rules boundary: when one runs, all do.
#
# NOT meter-testclock-index: the e2e-only testclock meter is not deployed and
# not part of the release; a testclock failure must not hold the release.
# internal/buildgate/ci_release_order_test.go pins all of this.
controller-index:
  tags: [cluster]
  extends: .gonk-index
  needs:
    - controller-image-amd64
    - controller-image-arm64
    - agent-index
    - intake-index
    - meter-index
  variables:
    IMAGE: gonk-controller

intake-index:
  tags: [cluster]
  extends: .gonk-index
  needs: [intake-image-amd64, intake-image-arm64]
  variables:
    IMAGE: gonk-intake

meter-index:
  tags: [cluster]
  extends: .gonk-index
  needs: [meter-image-amd64, meter-image-arm64]
  variables:
    IMAGE: gonk-meter

meter-testclock-index:
  tags: [cluster]
  extends: .gonk-index
  needs: [meter-testclock-image-amd64, meter-testclock-image-arm64]
  variables:
    IMAGE: gonk-meter
  before_script:
    - *gonk_tag_script
    - export MULTIARCH_SOURCE_TAG="$GONK_TAG-testclock"
    - export MULTIARCH_TAGS="$GONK_TAG-testclock"

# -----------------------------------------------------------------------------
# THE DEPLOYABLE-IMAGE GUARD (release-unit v2). On a default-branch pipeline
# that BUILT, after the controller index (the last tag published -- see
# controller-index), assert that every image the release consists of exists at
# THIS pipeline's $GONK_TAG. Main goes red otherwise. It is the tag gitops' one
# ImagePolicy will select, so this is the CI-side statement of "dev can pull it".
#
# THE RELEASE IS FOUR IMAGES: gonk-agent, gonk-controller, gonk-intake,
# gonk-meter -- everything the chart deploys or hands to a pod. Not the e2e-only
# testclock meter, which the chart never deploys.
#
# A FIELD ASSERTION, NEVER WELL-FORMEDNESS (CLAUDE.md, 2026-09-07; the model is
# hack/require_image_tags.py): each repository's tag list, as the registry
# returns it, must contain a line EXACTLY equal to $GONK_TAG (grep -x -F: no
# prefix, no regex). An empty listing is an error, not "nothing there".
#
# RETRIED LISTING, bounded: one failed `crane ls` must not red main (verifier
# R10), so each listing gets GUARD_LIST_ATTEMPTS tries with a linear backoff. A
# listing that SUCCEEDS but lacks the tag is not retried -- the controller index
# has already been published, so an absent tag is the finding, not a race.
#
# DOES NOT RUN ON A DOCS COMMIT, by design: its rules are the image inputs, so a
# commit that builds nothing produces no tag, the one ImagePolicy sees nothing
# new, and dev does not move -- there is nothing to guard. (A pipeline that is
# not a push -- web, schedule, API -- evaluates `changes:` as true, so it builds
# and is guarded.) Not on other branches: branch tags are never deployed.
#
# NOT allow_failure, `tags: [cluster]` (it dials the in-cluster registry
# Service, which the untagged runner cannot resolve), `needs: [controller-index]`.
# internal/buildgate/ci_release_order_test.go pins each of those and runs this
# script against a fake crane.
#
# WHY crane: .manifest-merge (homelab/ci-templates) already runs this exact,
# digest-pinned crane:debug image to publish every index this pipeline makes.
# -----------------------------------------------------------------------------
deployable-image-guard:
  tags: [cluster]
  stage: images
  image:
    # The SAME digest .manifest-merge pins (homelab/ci-templates kaniko.yml).
    name: gcr.io/go-containerregistry/crane:debug@sha256:54b27703e6c602fbd6f95712910e9c8d45d4361a59274bde38aeec943734e424
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: never
    - changes: *gonk_image_inputs
  needs: [controller-index]
  variables:
    # crane ships no DOCKER_CONFIG; set it explicitly, as .manifest-merge does.
    DOCKER_CONFIG: "/tmp/.docker"
    GUARD_IMAGES: "gonk-agent gonk-controller gonk-intake gonk-meter"
    GUARD_LIST_ATTEMPTS: "5"
    GUARD_RETRY_SLEEP: "10"
  before_script:
    - *gonk_tag_script
    - mkdir -p "$DOCKER_CONFIG"
    - |
      AUTH=$(printf %s "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"},"%s":{"auth":"%s"}}}' \
        "$CI_REGISTRY" "$AUTH" "$INTERNAL_REGISTRY_HOST" "$AUTH" \
        > "$DOCKER_CONFIG/config.json"
  script:
    - &deployable_image_guard_script |
      test -n "$GONK_TAG" || { echo "FAIL: GONK_TAG is empty"; exit 1; }
      test -n "$GUARD_IMAGES" || { echo "FAIL: GUARD_IMAGES is empty"; exit 1; }
      echo "every release image must exist at $GONK_TAG"
      LIST="${TMPDIR:-/tmp}/guard-tags.$$"
      missing=0
      for IMG in $GUARD_IMAGES; do
        n=1
        while :; do
          if crane ls --insecure "$INTERNAL_REGISTRY_REPO/$IMG" > "$LIST" && [ -s "$LIST" ]; then
            break
          fi
          echo "  listing $IMG failed or came back empty (attempt $n of $GUARD_LIST_ATTEMPTS)"
          if [ "$n" -ge "$GUARD_LIST_ATTEMPTS" ]; then
            echo "FAIL: could not list $INTERNAL_REGISTRY_REPO/$IMG -- an unreadable registry is not a pass"
            rm -f "$LIST"; exit 2
          fi
          sleep $((n * GUARD_RETRY_SLEEP))
          n=$((n + 1))
        done
        if grep -qxF -- "$GONK_TAG" "$LIST"; then
          echo "  PRESENT $IMG:$GONK_TAG"
        else
          echo "  ABSENT  $IMG:$GONK_TAG ($(wc -l < "$LIST") tags listed, none exactly this one)"
          missing=1
        fi
      done
      rm -f "$LIST"
      if [ "$missing" -ne 0 ]; then
        echo "FAIL: $GONK_TAG is not a complete release -- the one ImagePolicy must not deploy it"
        exit 1
      fi
      echo "ok: $GONK_TAG names every release image"

image-scan:
  tags: [cluster]
  stage: images
  rules:
    - when: never
  script:
    # Trivy HIGH,CRITICAL, --ignore-unfixed (spec 10.3). Needs the trivy binary
    # and its vuln DB, neither present on an offline runner.
    - make scan

# -----------------------------------------------------------------------------
# DOCUMENTED-MANUAL: publish the chart as an OCI artifact.
#
# OWNER DECISION (OD-8): which OCI registry, and with what credentials. Spec 7.1
# says CI publishes the chart as OCI; nothing says where. Off until answered.
# -----------------------------------------------------------------------------
chart-publish:
  tags: [cluster]
  stage: chart
  # entrypoint: [""] is REQUIRED (gonk-pk1z): alpine/helm's ENTRYPOINT is
  # `helm`, and the docker executor does not override it, so `sh -c script`
  # ran as `helm sh -c ...` -> 'unknown command "sh"'. Guarded by
  # internal/buildgate/ci_entrypoint_test.go.
  image:
    name: alpine/helm:3.19.0
    entrypoint: [""]
  rules:
    - when: never
  script:
    - helm package chart/gonk
    - helm push gonk-*.tgz oci://$CHART_REGISTRY
