# =============================================================================
# gonk CI.
#
# RUNNER REALITY (docs/environment.md): every GitLab runner on this cluster is
# OFFLINE, and no runner has ever executed a job for this repo -- the first
# images are built and pushed BY HAND (Makefile `push`). So this pipeline is
# written to be TRUE the day a runner lands, not to invent reach it does not
# have. Two consequences are baked in here:
#
#   * The Go gate is VENDORED + OFFLINE. GOFLAGS=-mod=vendor and GOPROXY=off are
#     global, so no job ever reaches a module proxy. `vendor/` is committed.
#   * Every job that needs podman, a network, or the registry (image build,
#     push, trivy scan, chart publish) is DOCUMENTED-MANUAL: `rules: when: never`
#     (or manual), with the real Makefile target it maps to. It does not run in
#     CI today; it is here so the mapping is not lost and so it turns on with a
#     single rule edit once a runner + registry credentials exist.
# =============================================================================

# Shared homelab CI: the kaniko image-build + helm-push templates and the
# orac.local cluster specifics (node pinning, the in-cluster registry Service,
# the zot pull-through mirror, pod sizing). This is the ESTABLISHED way images
# are built in CI on this cluster -- gonk consumes it rather than reinventing the
# unprivileged-kaniko dance. The `include` also merges that project's global
# `variables:` (INTERNAL_REGISTRY_REPO / INTERNAL_REGISTRY_HOST / ZOT_MIRROR /
# KUBERNETES_NODE_SELECTOR_HOSTNAME=johnny / pod sizing) into this pipeline.
# See homelab/ci-templates (gitlab.orac.local project 65) /kaniko.yml.
include:
  - project: 'homelab/ci-templates'
    ref: main
    file: '/kaniko.yml'

stages: [lint, test, chart, images]

variables:
  # Vendored + offline: the standing local gate is exactly
  #   GOFLAGS=-mod=vendor GOPROXY=off go test ./... -race
  # (plan 01). Setting them globally makes every Go job identical to it and
  # guarantees no job silently reaches out to a proxy the runner cannot see.
  GOFLAGS: "-mod=vendor"
  GOPROXY: "off"

# -----------------------------------------------------------------------------
# The Go gate (plan 01). Unchanged in intent; now explicitly offline/vendored.
# -----------------------------------------------------------------------------
lint:
  stage: lint
  # Pin the full tag. Must be v2.x to match .golangci.yml, and must be built
  # with a Go >= go.mod's directive or it cannot compile the module at all.
  # v2.12.2 is built with go1.26.2, and is the same version as the local gate.
  image: golangci/golangci-lint:v2.12.2
  script:
    - golangci-lint run ./...

test:
  stage: test
  image: golang:1.26
  script:
    - go vet ./...
    - go test ./... -race -count=1

# -----------------------------------------------------------------------------
# The chart gate.
# -----------------------------------------------------------------------------
chart-lint:
  stage: chart
  # Only needs helm. Pin the tag: helm's schema validation has changed behaviour
  # across minors before. Lints ALL EIGHT ci/ profiles (the four Task 9 plus the
  # four Task 8.5 toggle-matrix profiles), because the golden gate snapshots all
  # eight and a profile that renders but does not lint is a profile that ships broken.
  image: alpine/helm:3.19.0
  script:
    - for p in default byo-everything cnpg full-monitoring all-bundled external-dolt byo-gascity ledger-cnpg; do
        echo "== helm lint --strict ci/values-$p.yaml ==";
        helm lint --strict chart/gonk --values chart/gonk/ci/values-$p.yaml;
      done

chart-test:
  stage: chart
  # OWNER DECISION (OD-7): this image needs go + helm + kubeconform. Until it
  # exists, this job does not run and the chart gate is LOCAL -- which is where
  # plan 01's gate already lives (PLAN.md: no runner has ever executed a job).
  # The gate itself, run locally, is:
  #   go test -tags chart ./internal/charttest/... -count=1
  # It re-renders every profile, diffs the golden manifests, helm-lints, and
  # kubeconform -strict validates (CRDs against chart/gonk/tests/crd-schemas,
  # NOT -ignore-missing-schemas).
  image: $GONK_CHART_TOOLS_IMAGE
  rules:
    - if: $GONK_CHART_TOOLS_IMAGE
  script:
    - go test -tags chart ./internal/charttest/... -count=1

# -----------------------------------------------------------------------------
# The no-latest gate. This one CAN run in an offline runner: it is a pure-shell
# grep (Makefile `no-latest`), no podman, no network, no registry. `latest` is
# banned everywhere (docs/environment.md); Renovate cannot bump a floating tag.
# -----------------------------------------------------------------------------
no-latest:
  stage: images
  image: alpine:3.20
  script:
    - apk add --no-cache make grep
    - make no-latest

# -----------------------------------------------------------------------------
# Image build + push, IN CI, via unprivileged kaniko (homelab/ci-templates).
#
# HISTORY: the first gonk-controller/intake/meter images were built + pushed BY
# HAND (Makefile `push`) because every runner was offline and no runner had ever
# executed a job. That era is over -- a runner is online and pipelines are green,
# so images now build in CI. The k8s executor is `privileged = false` (no DinD),
# which is exactly what kaniko is for: it builds a Dockerfile in userspace and
# pushes straight to the in-cluster registry Service over plain HTTP (bypassing
# the Traefik ingress' blob-PATCH timeout and the private orac CA the executor
# pods don't mount). Auth is the CI job token -- registry.orac.local IS this
# GitLab's integrated registry, so $CI_REGISTRY_USER/$CI_REGISTRY_PASSWORD push
# to $CI_PROJECT_PATH with no deploy token.
#
# TAGGING stays gonk's convention, NOT the shared template's (sha8 + `latest`):
# $(GONK_VERSION)-<sha12>, matching images/versions.env + the Makefile so a CI
# build and a by-hand `make push` of the same commit produce the identical tag.
# `latest` is never pushed (G11 + the no-latest gate reject it on principle).
#
# The build-args come from images/versions.env (sourced in before_script), so CI
# and the Makefile read the exact same pins. The testclock meter is built with
# BUILD_TAGS=testclock to a SEPARATE `-testclock` tag and is NEVER the plain
# meter tag (a clock a file can move must never ship as production).
# -----------------------------------------------------------------------------
.gonk-kaniko:
  stage: images
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [""]
  # Build images on branch pipelines (and main). Heavy, but these are the
  # deliverable's proof that the build runs in CI; dial to `when: manual` later
  # if per-commit image churn becomes a concern.
  rules:
    - if: '$CI_COMMIT_BRANCH'
  # Serialize the image builds: the template pins every job to node johnny, and
  # five parallel kaniko pods there would contend for memory. One at a time gives
  # each build johnny's full headroom (and warms the shared layer cache in order).
  resource_group: gonk-images
  before_script:
    # Same pins the Makefile uses -- one source of truth (images/versions.env).
    - set -a; . images/versions.env; set +a
    - export GONK_TAG="${GONK_VERSION}-$(printf %s "$CI_COMMIT_SHA" | cut -c1-12)"
    - mkdir -p /kaniko/.docker
    # Job-token auth for both the external registry name and the internal Service
    # hostname kaniko actually dials -- same JWT realm either way.
    - |
      AUTH=$(printf %s "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"},"%s":{"auth":"%s"}}}' \
        "$CI_REGISTRY" "$AUTH" "$INTERNAL_REGISTRY_HOST" "$AUTH" \
        > /kaniko/.docker/config.json

agent-image:
  extends: .gonk-kaniko
  script:
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/images/Dockerfile.agent"
      --destination "$INTERNAL_REGISTRY_REPO/gonk-agent:$GONK_TAG"
      --build-arg GONK_TAG=$GONK_TAG
      --build-arg GO_VERSION=$GO_VERSION
      --build-arg DEBIAN_BASE=$DEBIAN_BASE
      --build-arg OPENCODE_VERSION=$OPENCODE_VERSION
      --build-arg GLAB_VERSION=$GLAB_VERSION
      --build-arg BD_VERSION=$BD_VERSION
      --cache=true
      --cache-repo="$INTERNAL_REGISTRY_REPO/cache"
      --compressed-caching=false
      --registry-mirror=$ZOT_MIRROR
      --insecure-registry=$ZOT_MIRROR
      --insecure-registry=$INTERNAL_REGISTRY_HOST
      --skip-tls-verify

controller-image:
  extends: .gonk-kaniko
  script:
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/images/Dockerfile.controller"
      --destination "$INTERNAL_REGISTRY_REPO/gonk-controller:$GONK_TAG"
      --build-arg GONK_TAG=$GONK_TAG
      --build-arg GO_VERSION=$GO_VERSION
      --build-arg DEBIAN_BASE=$DEBIAN_BASE
      --build-arg BD_VERSION=$BD_VERSION
      --build-arg DOLT_VERSION=$DOLT_VERSION
      --build-arg GASCITY_REF=$GASCITY_REF
      --cache=true
      --cache-repo="$INTERNAL_REGISTRY_REPO/cache"
      --compressed-caching=false
      --registry-mirror=$ZOT_MIRROR
      --insecure-registry=$ZOT_MIRROR
      --insecure-registry=$INTERNAL_REGISTRY_HOST
      --skip-tls-verify

intake-image:
  extends: .gonk-kaniko
  script:
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/images/Dockerfile.intake"
      --destination "$INTERNAL_REGISTRY_REPO/gonk-intake:$GONK_TAG"
      --build-arg GONK_TAG=$GONK_TAG
      --build-arg GO_VERSION=$GO_VERSION
      --build-arg DISTROLESS_BASE=$DISTROLESS_BASE
      --cache=true
      --cache-repo="$INTERNAL_REGISTRY_REPO/cache"
      --compressed-caching=false
      --registry-mirror=$ZOT_MIRROR
      --insecure-registry=$ZOT_MIRROR
      --insecure-registry=$INTERNAL_REGISTRY_HOST
      --skip-tls-verify

meter-image:
  extends: .gonk-kaniko
  script:
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/images/Dockerfile.meter"
      --destination "$INTERNAL_REGISTRY_REPO/gonk-meter:$GONK_TAG"
      --build-arg GONK_TAG=$GONK_TAG
      --build-arg GO_VERSION=$GO_VERSION
      --build-arg DISTROLESS_BASE=$DISTROLESS_BASE
      --cache=true
      --cache-repo="$INTERNAL_REGISTRY_REPO/cache"
      --compressed-caching=false
      --registry-mirror=$ZOT_MIRROR
      --insecure-registry=$ZOT_MIRROR
      --insecure-registry=$INTERNAL_REGISTRY_HOST
      --skip-tls-verify

# The e2e-only testclock meter: SAME Dockerfile, BUILD_TAGS=testclock, a distinct
# `-testclock` tag. Never the plain meter tag (Makefile meter-testclock-image;
# test/images/servers_smoke_test.go asserts the two images differ exactly here).
meter-testclock-image:
  extends: .gonk-kaniko
  script:
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/images/Dockerfile.meter"
      --destination "$INTERNAL_REGISTRY_REPO/gonk-meter:$GONK_TAG-testclock"
      --build-arg GONK_TAG=$GONK_TAG
      --build-arg GO_VERSION=$GO_VERSION
      --build-arg DISTROLESS_BASE=$DISTROLESS_BASE
      --build-arg BUILD_TAGS=testclock
      --cache=true
      --cache-repo="$INTERNAL_REGISTRY_REPO/cache"
      --compressed-caching=false
      --registry-mirror=$ZOT_MIRROR
      --insecure-registry=$ZOT_MIRROR
      --insecure-registry=$INTERNAL_REGISTRY_HOST
      --skip-tls-verify

image-scan:
  stage: images
  rules:
    - when: never
  script:
    # Trivy HIGH,CRITICAL, --ignore-unfixed (spec 10.3). Needs the trivy binary
    # and its vuln DB, neither present on an offline runner.
    - make scan

# -----------------------------------------------------------------------------
# DOCUMENTED-MANUAL: publish the chart as an OCI artifact.
#
# OWNER DECISION (OD-8): which OCI registry, and with what credentials. Spec 7.1
# says CI publishes the chart as OCI; nothing says where. Off until answered.
# -----------------------------------------------------------------------------
chart-publish:
  stage: chart
  image: alpine/helm:3.19.0
  rules:
    - when: never
  script:
    - helm package chart/gonk
    - helm push gonk-*.tgz oci://$CHART_REGISTRY
