# Source: gonk/templates/statefulset-gonk-dolt.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gonk-dolt
  labels:
    helm.sh/chart: gonk-0.0.0-golden
    app.kubernetes.io/name: gonk
    app.kubernetes.io/instance: gonk
    app.kubernetes.io/version: "0.2.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gonk
    app.kubernetes.io/component: dolt
spec:
  # ONE replica, ALWAYS. dolt sql-server is not clustered here; the Gas City
  # beads store needs ONE writer with real transactions. RECONCILED, Task 0:
  # this server hosts the beads database ONLY -- gonk-meter's reservation path
  # (the ledger) is Postgres/CNPG, never a database on this server (ADR-004
  # Decision 10; docs/spikes/dolt-reservation-isolation.md).
  replicas: 1
  serviceName: gonk-dolt
  selector:
    matchLabels:
      app.kubernetes.io/name: gonk
      app.kubernetes.io/instance: gonk
      app.kubernetes.io/component: dolt
  template:
    metadata:
      labels:
        helm.sh/chart: gonk-0.0.0-golden
        app.kubernetes.io/name: gonk
        app.kubernetes.io/instance: gonk
        app.kubernetes.io/version: "0.2.1"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: gonk
        app.kubernetes.io/component: dolt
    spec:
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dolt
          image: docker.io/dolthub/dolt-sql-server:2.1.7
          imagePullPolicy: IfNotPresent
          # R-48/T-26 (interim until T-56 deletes Dolt): root is no longer
          # root-open. See the command wrapper below for how the two Secret
          # keys (secrets.dolt) reach this container as env vars WITHOUT ever
          # being a secretKeyRef or a chart literal.
          env:
            # HOME is LOAD-BEARING (gonk-fsl in-cluster re-smoke, blocker C). The
            # dolthub image assumes it runs as root (HOME=/root) and sets no HOME
            # env; under this chart's podSecurityContext (runAsUser 65532) HOME then
            # resolves to `/`, and dolt dies on `mkdir /.dolt: permission denied`
            # writing its global config. Point HOME at the PVC mount (writable by
            # 65532 via fsGroup) so dolt writes .dolt alongside its data. The
            # controller template solves the identical uid/HOME problem the same way.
            - name: HOME
              value: /var/lib/dolt
            # R-48: root is bound to localhost ONLY -- the entrypoint's own
            # default when DOLT_ROOT_HOST is unset, but pinned explicitly so a
            # future edit cannot silently widen it back to "%" the way the
            # blocker-B fix once did. Root is therefore reachable ONLY via a
            # shell inside this pod (`kubectl exec` + `dolt sql-client`), never
            # cross-pod -- closing the "any pod can `mysql -h gonk-dolt -u
            # root`" finding. The controller's cross-pod login (the reason
            # DOLT_ROOT_HOST was widened to "%" in the first place) now uses
            # the `gc` user below instead, via DOLT_USER_HOST="%".
            - name: DOLT_ROOT_HOST
              value: "localhost"
            # The user the controller connects as (dolt.gcUser.username),
            # GRANT-scoped by the entrypoint's create_user_from_env to ONLY
            # DOLT_DATABASE below (GRANT ALL ON `db`.* -- never GRANT ALL
            # PRIVILEGES ON *.*, which is what root gets). Verified against
            # dolthub/dolt docker/docker-entrypoint.sh's create_user_from_env.
            - name: DOLT_USER
              value: "gc"
            # Reachable cross-pod (unlike root, above): this is the credential
            # the controller (a different pod) dials in with.
            - name: DOLT_USER_HOST
              value: "%"
            # Matches the --dolt-database flag `gc init` is passed
            # (workload-gonk-controller.yaml: "bd_" + dolt.database) -- the
            # ONE database DOLT_USER is granted on.
            - name: DOLT_DATABASE
              value: "bd_gonk"
          # The dolthub image ENTRYPOINT (docker-entrypoint.sh) already runs
          # `dolt sql-server --host=0.0.0.0 --port=3306 "$@"` AND does the
          # DOLT_ROOT_HOST bootstrap (blocker B). Passing sql-server/--host/--port
          # again collides -- `multiple values provided for 'host'` and a crash loop
          # (gonk-fsl in-cluster re-smoke, blocker D). So pass ONLY the extra flags;
          # the entrypoint supplies sql-server/--host/--port. The bundled server
          # therefore LISTENS ON 3306 (entrypoint-fixed) -- dolt.port must stay 3306
          # so the Service/containerPort/GC_DOLT_PORT match the real listener.
          # NOTE: `dolt sql-server` in dolthub 2.1.7 has NO --no-tls flag (TLS is
          # off by default unless tls_cert/tls_key is set) -- passing it is a fatal
          # `unknown option 'no-tls'` crash (gonk-fsl re-smoke, blocker E). Pass only
          # --data-dir (not injected by the entrypoint); host/port come from it.
          #
          # R-48/T-26: DOLT_ROOT_PASSWORD and DOLT_PASSWORD cannot be plain
          # `env:` values (the chart never reads a Secret's content at render
          # time, and a chart-generated/default password is exactly what this
          # task closes) and cannot be a secretKeyRef (this chart's own rule --
          # TestSecretsAreNeverEnvironmentVariables -- forbids it: that would
          # put the credential in the Pod spec, visible to `kubectl get pod -o
          # yaml` and every audit log). So `command` REPLACES the image's
          # default ENTRYPOINT+CMD with an equivalent invocation
          # (`tini -- docker-entrypoint.sh`, from the image's own Dockerfile)
          # wrapped in a shell that `cat`s the two FILE-mounted Secret keys
          # (secrets.dolt, mounted below exactly like every other secret in
          # this chart) into env vars for JUST this process, right before
          # exec-ing it. The value never appears in the rendered manifest.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export DOLT_ROOT_PASSWORD="$(cat /etc/gonk/secrets/dolt/root-password)"
              export DOLT_PASSWORD="$(cat /etc/gonk/secrets/dolt/gc-password)"
              exec tini -- docker-entrypoint.sh --data-dir=/var/lib/dolt
          ports:
            - name: mysql
              containerPort: 3306
          # A TCP probe only: an authenticating probe would need a client AND a
          # copy of the credential in the probe command (visible via `kubectl
          # describe pod`) -- readiness is "the port accepts a connection",
          # not "the gc user's grant is correct" (the charttest render suite
          # covers the latter).
          livenessProbe:
            tcpSocket: {port: mysql}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket: {port: mysql}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/dolt
            - name: secret-dolt
              mountPath: /etc/gonk/secrets/dolt
              readOnly: true
      volumes:
        - name: secret-dolt
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: gonk-dolt
                  items:
                    - key: root-password
                      path: root-password
                    - key: gc-password
                      path: gc-password
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
