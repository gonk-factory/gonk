apiVersion: v1
kind: Pod
metadata:
  name: gonk-netpol-probe
  labels:
    helm.sh/chart: gonk-0.0.0-golden
    app.kubernetes.io/name: gonk
    app.kubernetes.io/instance: gonk
    app.kubernetes.io/version: "0.2.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gonk
    app.kubernetes.io/component: netpol-probe
    app: gc-agent
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 180
  serviceAccountName: default
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: "ghcr.io/gonk-factory/gonk/gonk-intake:v0.1.0"
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      args:
        - netpol-probe
        - -allow
        - "gonk-meter:8080"
        - -deny
        - "gonk-intake:8080"
        - -deny-l3
        - "gonk-controller:9443"
        - -settle-timeout
        - "30s"
        - -dial-timeout
        - "3s"
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
