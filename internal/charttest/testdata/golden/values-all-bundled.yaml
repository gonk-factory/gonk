# Source: gonk/templates/role-gc-controller.yaml
apiVersion: rbac.authorization.k8s.io/v1
# NAMESPACED Role, NEVER a ClusterRole. A ClusterRole would let a compromised
# controller reach agent pods in EVERY namespace -- exactly the blast radius this
# must not have. Verbs transcribed from docs/environment.md (read off Gas City's
# source): the k8s session provider creates/execs/logs agent SESSION pods and
# reads/writes the ConfigMaps that carry per-session state. Least privilege --
# nothing beyond pods, pods/exec, pods/log, configmaps.
kind: Role
metadata:
  name: gc-controller
  labels:
    helm.sh/chart: gonk-0.0.0-golden
    app.kubernetes.io/name: gonk
    app.kubernetes.io/instance: gonk
    app.kubernetes.io/version: "0.2.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gonk
    app.kubernetes.io/component: controller
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  # GET ONLY, and only so the agent stops receiving the proxy ADMIN key
  # (gonk-8gb). The meter keysinks each project's LiteLLM virtual key into a
  # Secret here and dispatch already carried a POINTER to it; nothing followed
  # the pointer, so `litellm_key` forwarded the controller's own mounted key --
  # which is the LiteLLM MASTER key. Every session therefore authenticated as
  # the proxy administrator, on a key with no alias and no budget, which is why
  # the per-project ceiling was never consulted.
  #
  # THIS IS A NET REDUCTION IN PRIVILEGE, not an increase. The controller
  # already holds the master key, which can create, read and delete every
  # virtual key on that proxy; letting it read one project key is strictly less
  # than that, and it is what allows the admin key to stop leaving this pod.
  #
  # get, never list: the controller resolves ONE secret whose name the meter
  # supplied, and a list verb would let a compromised controller enumerate every
  # project's credential rather than the one it was told about. resourceNames
  # cannot be used -- the names derive from project paths that do not exist at
  # install time (keysink.Slug) -- which is the same constraint the meter's own
  # Role documents, and the same reason this namespace should hold nothing else.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
# Source: gonk/templates/role-gonk-gate-jobs.yaml
apiVersion: rbac.authorization.k8s.io/v1
# THE SESSION RUNTIME'S GRANT (gonk-t55, plan D6/P5). NAMESPACED Role, NEVER a
# ClusterRole: gonk-gate creates every agent session as a Kubernetes Job in the
# release namespace, and nowhere else.
#
# WHAT EACH RULE IS FOR -- one line per pkg/runtime/jobs call (jobs.go):
#   batch/jobs  create        Start: the session Job
#               get           Start's AlreadyExists path (D2: the name is the
#                             idempotency key; the existing Job is read to check
#                             it is a gonk session and not being deleted);
#                             Status; Output; Stop (the Job's UID for the
#                             delete precondition)
#               list          List (label gonk-factory.github.io/component=agent-session),
#                             which the sweep's stale-session pass uses (D7)
#               delete        Stop, and Start's rollback when the Secret fails (D3)
#   secrets     create        Start: the per-Job Secret carrying prompt,
#                             litellm-key, metadata.json and rig-url (D3)
#               get           Stop: read the Secret to delete it only if the
#                             stopped Job owns it
#               delete        Stop, so the prompt and key do not outlive it by
#                             however long garbage collection takes; normally
#                             the Secret also goes with the Job through its
#                             ownerReference
#   pods        list          Status and Output: find the Job's pod by the
#                             gonk-factory.github.io/session label (kept only if the
#                             Job's UID controls it)
#   pods/log    get           Output: the full container log the sweep judges
#
# No watch (nothing watches: the sweep polls) and no pods get (the pod is only
# ever found by list). Both were in the first version of this Role and were
# dropped once the runtime existed to check against (t55 verify round 1).
#
# NOTHING ELSE. No update or patch on anything, no pods/exec, no create on pods
# (the Job controller creates the pod, not gonk-gate), no jobs/status. The rule
# list is asserted exactly by internal/charttest/jobs_rbac_test.go.
#
# BE CLEAR ABOUT WHAT THIS ROLE ADDS. gc-controller already holds pods and
# pods/log and secrets:[get] through Role gc-controller (Gas City's session
# provider needs them). What is NEW is batch/jobs, and secrets create/delete.
# secrets:[delete] cannot be narrowed with resourceNames because Job Secret
# names are minted per session; it is scoped to this namespace and to the one
# ServiceAccount the binding names, which is the whole of the blast radius.
kind: Role
metadata:
  name: gonk-gate-jobs
  labels:
    helm.sh/chart: gonk-0.0.0-golden
    app.kubernetes.io/name: gonk
    app.kubernetes.io/instance: gonk
    app.kubernetes.io/version: "0.2.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gonk
    app.kubernetes.io/component: controller
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
