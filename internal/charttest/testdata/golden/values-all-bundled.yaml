# Source: gonk/templates/networkpolicy-gonk-intake.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gonk-intake
  labels:
    helm.sh/chart: gonk-0.0.0-golden
    app.kubernetes.io/name: gonk
    app.kubernetes.io/instance: gonk
    app.kubernetes.io/version: "0.2.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gonk
    app.kubernetes.io/component: intake
  annotations:
    gonk-factory.github.io/network-policy-enforcement: "Enforced only where the cluster's network plugin (CNI) implements NetworkPolicy. The API server accepts this object either way; where it is not enforced it blocks nothing, and local-model budgets are advisory. Run helm test on the release to find out which; see chart/gonk/README.md, section 0."
spec:
  # ENFORCED ONLY WHERE THE CLUSTER'S NETWORK PLUGIN IMPLEMENTS NetworkPolicy.
  # The API server accepts this object either way; on a CNI that does not
  # implement it, this object blocks nothing. `helm test` reports which you
  # have. See chart/gonk/README.md, section 0.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gonk
      app.kubernetes.io/instance: gonk
      app.kubernetes.io/component: intake
  policyTypes: [Ingress, Egress]
  ingress:
    # The webhook, from the ingress controller only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
    # The private listener, from Prometheus (metrics, health).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
    # The private listener, from the two pods that use the per-session checkout
    # (pkg/rig, gonk-msz): gonk-gate in the controller REGISTERS it
    # (POST /rig/{alias}) and the agent session pod FETCHES it
    # (GET /rig/{alias}.tar.gz).
    #
    # THIS IS THE INGRESS HALF OF TWO RULES THAT ALREADY EXISTED (gonk-nax7).
    # gonk-agent and gonk-controller have each allowed EGRESS to this port since
    # the checkout was built, and nothing here admitted either of them, so on a
    # cluster that enforces NetworkPolicy both calls were dropped on the way in
    # and every session ran with no working copy. A permission between two pods
    # in this namespace is two rules; TestEveryInNamespaceRuleHasItsOtherHalf
    # fails when either is edited alone.
    #
    # WHAT ELSE THIS ADMITS, because a NetworkPolicy cannot tell one path or
    # method from another: EVERYTHING on the private listener is reachable from
    # an agent session pod, a pod that runs text written by whoever opened the
    # issue. That is the unauthenticated POST /admin/reconcile, and it is the
    # REGISTRATION route itself: POST /rig/{alias} is not authenticated either
    # (pkg/rig/http.go), so a session pod can register a checkout of any
    # project the forge token can read, and then fetch it. The policy cannot
    # close that. Authenticating the registration, or serving the fetch on a
    # listener of its own, would; until then a session is confined to its own
    # project by the agent's instructions and not by the network. On a cluster
    # that does not enforce NetworkPolicy this was already the case.
    - from:
        - podSelector:
            matchLabels:
              app: gc-agent
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gonk
              app.kubernetes.io/instance: gonk
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # GitLab.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gitlab
    # gonk-meter (register projects, read state).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gonk
              app.kubernetes.io/instance: gonk
              app.kubernetes.io/component: meter
      ports:
        - protocol: TCP
          port: 8080
    # The Gas City supervisor (fire orders), at GONK_SUPERVISOR_URL. Split the
    # same way gonk-meter's controller INGRESS is split, and for the same
    # reason -- the URL is derived, so the rule must follow it:
    #   * bundled controller -> in THIS namespace (component: controller), on
    #     gascity.supervisorPort. The gascity namespaceSelector below names a
    #     namespace the bundled controller does not live in, on a port it does
    #     not listen on, so it permitted NOTHING the bundled default actually
    #     dials: a webhook could never become a session. The controller's own
    #     policy has admitted intake on that port since it was written; this is
    #     the outbound half that was never written with it (gonk-zjk7).
    #   * BYO controller     -> the gascity namespaceSelector/ports.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gonk
              app.kubernetes.io/instance: gonk
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 9443
---
# Source: gonk/templates/networkpolicy-gonk-meter.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gonk-meter
  labels:
    helm.sh/chart: gonk-0.0.0-golden
    app.kubernetes.io/name: gonk
    app.kubernetes.io/instance: gonk
    app.kubernetes.io/version: "0.2.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gonk
    app.kubernetes.io/component: meter
  annotations:
    gonk-factory.github.io/network-policy-enforcement: "Enforced only where the cluster's network plugin (CNI) implements NetworkPolicy. The API server accepts this object either way; where it is not enforced it blocks nothing, and local-model budgets are advisory. Run helm test on the release to find out which; see chart/gonk/README.md, section 0."
spec:
  # ENFORCED ONLY WHERE THE CLUSTER'S NETWORK PLUGIN IMPLEMENTS NetworkPolicy.
  # The API server accepts this object either way; on a CNI that does not
  # implement it, this object blocks nothing. `helm test` reports which you
  # have. See chart/gonk/README.md, section 0.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gonk
      app.kubernetes.io/instance: gonk
      app.kubernetes.io/component: meter
  policyTypes: [Ingress, Egress]
  ingress:
    # intake (project registration) and the agent pods (prompt-by-reference:
    # GET /v1/prompt/{alias}, POST /v1/trace). Both are in this namespace.
    # WITHOUT THE AGENT HALF NO SESSION EVER RECEIVES A PROMPT.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gonk
              app.kubernetes.io/instance: gonk
              app.kubernetes.io/component: intake
        - podSelector:
            matchLabels:
              app: gc-agent
      ports:
        - protocol: TCP
          port: 8080
    # The PACK's exec orders -- gonk-dispatch (POST /v1/policy/decide) and
    # gonk-sweep (POST /v1/policy/outcome) -- run inside the Gas City controller.
    # WITHOUT THIS RULE, NO SESSION CAN EVER SPAWN.
    #   * bundled controller  -> in THIS namespace (component: controller)
    #   * BYO controller      -> the gascity namespaceSelector
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gonk
              app.kubernetes.io/instance: gonk
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 8080
    # THE LITELLM PROXY, for trajectory-evidence ingest only (gonk-p8j).
    #
    # This is a DELIBERATE widening of the meter's ingress and it is worth being
    # precise about what it does and does not grant. The proxy needs to POST
    # /v1/trace because it is the one collection point the agent pod cannot
    # reach, edit, or even see -- which is the entire reason the evidence is
    # worth having. Collecting it inside the pod would make it a field the agent
    # fills in.
    #
    # It grants NETWORK REACHABILITY ONLY. Every route on this port still
    # requires the bearer token, so this rule cannot read a budget, move a
    # reservation, or take a prompt; it lets a pod that already holds the meter
    # token talk to the meter. Scoped to the proxy's own pod labels rather than
    # the whole namespace, so a sidecar or a cronjob in the litellm namespace
    # does not inherit it.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: litellm
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - protocol: TCP
          port: 8080
    # Prometheus (/metrics is unauthenticated; the rest of the API is not).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # LiteLLM's ADMIN API: provision virtual keys, read /spend/logs. This is a
    # different door from the agents' -- same host, admin credential.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: litellm
      ports:
        - protocol: TCP
          port: 4000
    # The ledger. RECONCILED, Task 0: the OLD `ledger.backend == "dolt"` branch is
    # DELETED -- that state does not exist any more (ADR-004 Decision 10), and
    # meter never has a legitimate reason to egress to the Dolt Service (it backs
    # beads only). The `cnpg` branch below is unchanged. A gap this reconciliation
    # ALSO closes: the DEFAULT ledger.postgres.mode is `shared` (an existing
    # CloudNativePG cluster), and the original text had NO egress
    # rule for that mode at all -- meter's own default profile would have had no
    # NetworkPolicy path to its own ledger. `external` has the same gap. Both now
    # get a namespaceSelector egress, matching the litellm/dns pattern above.
    
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases-app
      ports:
        - protocol: TCP
          port: 5432
    # THE KUBERNETES API SERVER (gonk-vxel). The KeySink writes each project's
    # LiteLLM key as a Secret (Role gonk-meter), through the API server. It is
    # not a pod, so no selector names it: the rule is an ipBlock, and the
    # addresses are yours (networkPolicy.kubeAPI.cidrs, with .ports).
    #
    # WITH THE VALUE UNSET THERE IS NO RULE, and on a cluster that enforces
    # NetworkPolicy the meter cannot deliver a key: every project stays without
    # one and nothing runs. See values.yaml and chart/gonk/README.md, section 0.
    - to:
        - ipBlock:
            cidr: 192.0.2.10/32
        - ipBlock:
            cidr: 192.0.2.11/32
      ports:
