# Source: gonk/templates/networkpolicy-default-deny.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gonk-default-deny
  labels:
    helm.sh/chart: gonk-0.0.0-golden
    app.kubernetes.io/name: gonk
    app.kubernetes.io/instance: gonk
    app.kubernetes.io/version: "0.2.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gonk
  annotations:
    gonk-factory.github.io/network-policy-enforcement: "Enforced only where the cluster's network plugin (CNI) implements NetworkPolicy. The API server accepts this object either way; where it is not enforced it blocks nothing, and local-model budgets are advisory. Run helm test on the release to find out which; see chart/gonk/README.md, section 0."
spec:
  # ==========================================================================
  # !!! ENFORCED ONLY WHERE THE CLUSTER'S NETWORK PLUGIN IMPLEMENTS IT !!!
  # The API server accepts a NetworkPolicy whether or not the CNI implements
  # NetworkPolicy, and some do not. On such a cluster THIS OBJECT BLOCKS
  # NOTHING: it is correct, it ships, and it starts enforcing the day the
  # network plugin does -- with no further work. Do not read it as a guarantee
  # until `helm test` has reported ENFORCED on your cluster.
  # See docs/environment.md ("KNOWN LIMITATION") and chart/gonk/README.md,
  # section 0.
  # ==========================================================================
  #
  # Deny everything, in both directions, for every pod in this namespace. The
  # policies that follow ADD back exactly what each component needs. Without this
  # one, they add permissions to pods that already had all of them, and the whole
  # exercise is theatre.
  #
  # THIS APPLIES TO AGENT SESSION PODS TOO -- as long as they are in this
  # namespace. If Gas City's session provider puts them somewhere else, this
  # policy does not touch them and spec 9's guarantee does not exist. (OD-5.)
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Source: gonk/templates/networkpolicy-gonk-agent.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gonk-agent
  labels:
    helm.sh/chart: gonk-0.0.0-golden
    app.kubernetes.io/name: gonk
    app.kubernetes.io/instance: gonk
    app.kubernetes.io/version: "0.2.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gonk
    app.kubernetes.io/component: agent-session
  annotations:
    gonk-factory.github.io/network-policy-enforcement: "Enforced only where the cluster's network plugin (CNI) implements NetworkPolicy. The API server accepts this object either way; where it is not enforced it blocks nothing, and local-model budgets are advisory. Run helm test on the release to find out which; see chart/gonk/README.md, section 0."
spec:
  # ==========================================================================
  # *** THE POLICY THE BUDGET CLAIM RESTS ON -- ENFORCED ONLY IF YOUR CNI DOES. ***
  #
  # "Model access exists only through the metered proxy, so budgets cannot be
  # bypassed" is TRUE ONLY IF (a) this selector matches the session pods
  # (networkPolicy.agentPodSelector), AND (b) the cluster's network plugin
  # actually enforces NetworkPolicy.
  #
  # WHERE (b) IS FALSE, a session pod can reach anything its node can -- for
  # example a model server on the local network (http://192.0.2.10:11434) THAT
  # NEEDS NO CREDENTIAL -- skip LiteLLM entirely, and use it with ZERO METERING.
  #
  # Therefore:
  #   * CLOUD-rung budgets ARE hard: a cloud call needs an API key, and the pod's
  #     only route to one is LiteLLM's virtual key, which refuses at the ceiling.
  #   * LOCAL-model budgets are ADVISORY wherever this policy is not enforced.
  # Say it that way in every README, dashboard and demo. Not "budgets cannot be
  # bypassed".
  #
  # `helm test` (templates/test-netpol-probe.yaml) is what tells the two cases
  # apart on a real cluster -- and note that a WRONG selector renders fine and
  # enforces nothing, so the probe, not this template, is what proves it.
  # ==========================================================================
  podSelector:
    matchLabels:
      app: gc-agent
  policyTypes: [Egress]
  egress:
    # DNS. Without it the pod resolves nothing and reaches nothing.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # LiteLLM: THE ONLY DOOR TO A MODEL. Every token an agent spends passes
    # through it, tagged, budgeted, and hard-refusable.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: litellm
      ports:
        - protocol: TCP
          port: 4000
    # gonk-intake (PRIVATE listener): the per-session checkout. gonk-gate
    # shallow-clones the project CONTROLLER-SIDE at the decision point and
    # registers it under the session alias; the pod fetches that tree here
    # before opencode starts. This is the only reason an agent needs a
    # repository, and it deliberately does NOT go to the forge -- the bytes come
    # from gonk, so the pod still holds no forge credentials (gonk-msz).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gonk
              app.kubernetes.io/instance: gonk
              app.kubernetes.io/component: intake
      ports:
        - protocol: TCP
          port: 9090
    # GitLab: DELIBERATELY NO EGRESS (gonk-7oz).
    #
    # This used to allow the agent the WHOLE gitlab namespace on EVERY port,
    # under the v1 assumption in the old comment here ("the agent clones the rig
    # and posts comments as the bot"). Neither is true under the broker design:
    # the controller does all forge I/O -- it reads the issue, and gonk-sweep
    # applies the agent's proposed-effects batch under its own PAT -- and the
    # checkout now comes from gonk-intake above.
    #
    # It mattered because "the agent never talks to GitLab" (images/agent/
    # entrypoint.sh) was enforced by ONE thing: the absence of a credential.
    # With this rule in place, anything that put a usable token in the pod got
    # full forge reach with no second line of defence -- and the v1 formula pour
    # did exactly that, handing every session a bot_token. That pour is gone
    # (ADR-007 deleted the formula layer and the order vars map with it), so no
    # forge credential reaches an agent pod today. This rule is the second line
    # of defence that keeps "the agent never talks to GitLab" true even if one
    # ever does again. The agent also runs attacker-influenceable text by
    # construction (issue titles and bodies), which gonk-e9m already showed
    # reaching a shell.
    #
    # `mention-reply` is still not ported to the broker, and since the formula
    # layer was deleted it does not run at all: it is absent from agentForTrigger
    # (cmd/gonk-gate/broker_inject.go), so runDispatch refuses the trigger
    # outright rather than pouring a session. Nothing is broken by this rule
    # today, and turning the egress back on would not revive mention -- porting
    # it (T-24) means putting it on the broker, where the CONTROLLER does the
    # forge I/O. networkPolicy.gitlabEgress.enabled=true restores the old
    # behaviour and re-opens exactly the hole described above.
    # gonk-meter: prompt-by-reference (gonk-mzd). THE POD RECEIVES NO WORK
    # WITHOUT THIS RULE -- images/agent/entrypoint.sh fetches its own prompt at
    # GET /v1/prompt/{GC_ALIAS} (the alias is the capability; no token rides
    # this call) and posts trajectory evidence back at POST /v1/trace. This rule
    # predates that: it was opened so the agent could read its own session cost
    # for the commit trailers, and those were deleted with the trailers hook.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gonk
              app.kubernetes.io/instance: gonk
              app.kubernetes.io/component: meter
      ports:
        - protocol: TCP
          port: 8080
    # AND NOTHING ELSE. No 0.0.0.0/0. No "just for pip". An agent pod that can
    # reach the internet can reach api.anthropic.com directly, with a key from
    # anywhere, and every budget in this system becomes a suggestion.
---
# Source: gonk/templates/networkpolicy-gonk-controller.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gonk-controller
  labels:
    helm.sh/chart: gonk-0.0.0-golden
    app.kubernetes.io/name: gonk
    app.kubernetes.io/instance: gonk
    app.kubernetes.io/version: "0.2.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gonk
    app.kubernetes.io/component: controller
  annotations:
    gonk-factory.github.io/network-policy-enforcement: "Enforced only where the cluster's network plugin (CNI) implements NetworkPolicy. The API server accepts this object either way; where it is not enforced it blocks nothing, and local-model budgets are advisory. Run helm test on the release to find out which; see chart/gonk/README.md, section 0."
spec:
  # ENFORCED ONLY WHERE THE CLUSTER'S NETWORK PLUGIN IMPLEMENTS NetworkPolicy.
  # The API server accepts this object either way; on a CNI that does not
  # implement it, this object blocks nothing. `helm test` reports which you
  # have. See chart/gonk/README.md, section 0.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gonk
      app.kubernetes.io/instance: gonk
      app.kubernetes.io/component: controller
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gonk
              app.kubernetes.io/instance: gonk
              app.kubernetes.io/component: intake
      ports:
        - protocol: TCP
          port: 9443
  egress:
    # DNS, GitLab, Dolt (beads), gonk-meter, gonk-intake's private listener, the
    # work store's Postgres, and the Kubernetes API server (last rule).
    #
    # DNS on UDP AND TCP (gonk-6xzj): a response that does not fit in a datagram
    # is retried over TCP, and this policy alone allowed UDP only.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gonk
              app.kubernetes.io/instance: gonk
              app.kubernetes.io/component: dolt
      ports:
        - protocol: TCP
          port: 3306
    # gonk-meter, at GONK_METER_URL -- which this chart sets on THIS pod. Three
    # callers live here, not one: the in-controller gonk-gate exec orders
    # (gonk-dispatch POST /v1/policy/decide, gonk-sweep POST /v1/policy/outcome
    # and its spend gathering) and the `meter-reachable` warm-up doctor check
    # (GET /healthz). gonk-meter's OWN policy has admitted `component:
    # controller` on this port since it was written; this is the outbound half
    # that was never written with it, so the permission was one-sided and every
    # one of those calls was dropped on the way OUT (gonk-zjk7). A component
    # that is configured to call a Service it may not reach is the class
    # TestInClusterDialsHaveEgress now fails the build on.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gonk
              app.kubernetes.io/instance: gonk
              app.kubernetes.io/component: meter
      ports:
        - protocol: TCP
          port: 8080
    # gonk-intake's PRIVATE listener, at GONK_RIG_BASE_URL. gonk-gate REGISTERS
    # the per-session checkout there (pkg/rig, gonk-msz) before it creates the
    # session; without this rule the grant POST is dropped and every session
    # runs with no working copy -- and scaffold falls back quietly rather than
    # failing, so nothing would go red. Same one-sided permission as the meter
    # rule above (gonk-zjk7).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gonk
              app.kubernetes.io/instance: gonk
              app.kubernetes.io/component: intake
      ports:
        - protocol: TCP
          port: 9090
    # The work store (gonk-t41): the in-pod gonk-gate keeps its state in
    # Postgres, on the same server as the meter's ledger (its own role and
    # schema). The same rule as gonk-meter's ledger egress.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases-app
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gitlab
    # THE KUBERNETES API SERVER (gonk-vxel). gonk-gate creates every session as
    # a Job and reads its pod, log and Secrets (Roles gonk-gate-jobs and
    # gc-controller), all through the API server. The API server is not a pod,
    # so no selector names it: the rule is an ipBlock, and the addresses are
    # yours (networkPolicy.kubeAPI.cidrs, with .ports).
    #
    # WITH THE VALUE UNSET THERE IS NO RULE, and on a cluster that enforces
    # NetworkPolicy NO SESSION JOB IS CREATED: the dispatch is refused at the
    # first API call. The chart does not guess an address, because the only
    # guess that is right on every cluster is 0.0.0.0/0. See values.yaml and
    # chart/gonk/README.md, section 0.
    - to:
        - ipBlock:
            cidr: 192.0.2.10/32
        - ipBlock:
            cidr: 192.0.2.11/32
      ports:
        - protocol: TCP
          port: 6443
---
