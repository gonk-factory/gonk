apiVersion: rbac.authorization.k8s.io/v1
# NAMESPACED, and pods:[get] ONLY (docs/environment.md). An agent session pod reads
# its own pod object and NOTHING else -- no list/watch, no create/exec/delete, no
# configmaps. If this ever grows a verb, a compromised agent gains reach; keep it
# to the single grant Gas City's source actually needs.
kind: Role
metadata:
  name: gc-agent
  labels:
    helm.sh/chart: gonk-0.0.0-golden
    app.kubernetes.io/name: gonk
