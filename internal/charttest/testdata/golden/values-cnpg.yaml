  replicas: 2
  # Intake IS safe to roll and to scale: it holds no persistent state, its project
  # cache is derived from GitLab on every pass, and its writes (the onboarding MR,
  # the hook) are idempotent. The controller dedupes orders on BeadAnchor.
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: gonk
      app.kubernetes.io/instance: gonk
      app.kubernetes.io/component: intake
  template:
    metadata:
      labels:
        helm.sh/chart: gonk-0.1.0
        app.kubernetes.io/name: gonk
        app.kubernetes.io/instance: gonk
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: gonk
        app.kubernetes.io/component: intake
    spec:
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: gitlab-registry-pull-creds
      containers:
        - name: intake
          image: registry.orac.local/agentic/gonk-project/gonk-intake:v0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GONK_GITLAB_URL
              value: "https://gitlab.orac.local"
            - name: GONK_BOT_USERNAME
              value: "gonk"
            # *** PATHS, NOT VALUES. ***
            - name: GONK_GITLAB_TOKEN_FILE
              value: "/etc/gonk/secrets/gitlab/token"
            # THE PRIVATE CA. trust-manager publishes `trust-bundle` into every
            # namespace; Go's crypto/x509 reads SSL_CERT_FILE with no code change.
            # *** THIS IS HOW WE TRUST https://gitlab.orac.local. *** Belt-and-
            # braces: images/Dockerfile.intake's own ENV already sets this; this
            # entry is what makes the file the env var names actually EXIST on
            # disk (the volume mount below), and it is the reason no code in this
            # repo ever sets InsecureSkipVerify -- there is no value that disables
            # TLS verification, and there never will be.
            - name: SSL_CERT_FILE
              value: "/etc/ssl/orac/ca.crt"
            - name: GONK_WEBHOOK_SECRET_FILE
              value: "/etc/gonk/secrets/webhook/token"
            - name: GONK_WEBHOOK_TOKEN_GEN
              value: "1"
            - name: GONK_WEBHOOK_PUBLIC_URL
              value: "https://gonk.orac.local/hook/gitlab"
            - name: GONK_WEBHOOK_SSL_VERIFY
              value: "true"
            - name: GONK_METER_URL
              value: "http://gonk-meter:8080"
            - name: GONK_METER_TOKEN_FILE
              value: "/etc/gonk/secrets/meter-api/token"
            # Empty -> the LogDispatcher: orders are LOGGED and never fired. It is
            # set explicitly (not omitted) so a stale env cannot resurrect the HTTP
            # dispatcher on a rolling update. When dispatch=http the URL is DERIVED
            # from the in-chart controller Service (gascity.enabled) or from
            # gascity.supervisorURL (BYO controller) -- see `gonk.supervisorURL`.
            - name: GONK_SUPERVISOR_URL
              value: "http://gonk-controller.gonk.svc:9443"
            # WRITE-AUTH (gonk-fsl / gonk-5we). The bundled controller runs
            # `gc start --foreground` grant-gated, so every order-run POST must
            # carry a fresh ed25519 X-GC-City-Write grant. These name the 0400
            # file mount of the PRIVATE signing key (a PATH, never a value) and the
            # kid derived from gascity.writeAuth.verifyKey's public half -- the same
            # keypair the in-controller gonk-gate signs with. Empty key file => no
            # grant => the controller rejects the dispatch, which G22 prevents by
            # requiring the key when gascity.enabled.
            - name: GONK_GC_WRITE_KEY_FILE
              value: "/etc/gonk/secrets/gc-write-key/key"
            - name: GONK_GC_WRITE_KEY_ID
              value: "k1"
            # RECONCILED, Task 0: intake carries its OWN copy of the operator
            # ladder (main.go's loadConfig fails closed if this is unset/empty --
            # ADR-002). It MUST be the same ladder gonk-meter resolves rungs
            # against (operatorConfig.instance.ladder), never a separate value
            # that could drift from it. Comma-separated; the schema's minItems:1
            # on operatorConfig.instance.ladder is what already guards "empty".
            - name: GONK_INSTANCE_LADDER
              value: "qwen-local"
            - name: GONK_RECONCILE_INTERVAL
              value: "10m"
            - name: GONK_LISTEN_ADDR
              value: ":8080"
            - name: GONK_PRIVATE_ADDR
              value: ":9090"
            - name: GONK_VERSION
              value: "0.1.0"
          ports:
            # The PUBLIC listener: POST /hook/gitlab, and 404 for everything else.
            - name: http-hook
              containerPort: 8080
            # The PRIVATE listener: /healthz, /readyz, /metrics, POST /admin/reconcile.
            # NEVER INGRESSED. /admin/reconcile is unauthenticated.
            - name: http-private
              containerPort: 9090
          livenessProbe:
            httpGet: {path: /healthz, port: http-private}
            initialDelaySeconds: 5
            periodSeconds: 20
          # /readyz is true only when the bot identity resolved, the first
          # reconcile completed, AND gonk-meter's /healthz is OK. So a meter
          # outage takes intake OUT of the Service -- the webhook 502s and GitLab
          # retries. That is fail-closed (no unmetered dispatch), but GitLab
          # auto-disables hooks that fail repeatedly: Plan 06 must test the
          # recovery path.
          readinessProbe:
            httpGet: {path: /readyz, port: http-private}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: secret-gitlab
              mountPath: /etc/gonk/secrets/gitlab
              readOnly: true
            - name: secret-webhook
              mountPath: /etc/gonk/secrets/webhook
              readOnly: true
            - name: secret-meter-api
              mountPath: /etc/gonk/secrets/meter-api
              readOnly: true
            # The ed25519 PRIVATE signing key, 0400, mounted at $root/gc-write-key.
            - name: secret-gc-write-key
              mountPath: /etc/gonk/secrets/gc-write-key
              readOnly: true
            # The private-CA bundle, mounted at exactly the path SSL_CERT_FILE names.
            # subPath so the file lands at /etc/ssl/orac/ca.crt and not in a dir.
            - name: orac-ca
              mountPath: /etc/ssl/orac/ca.crt
              subPath: tls-ca-bundle.pem
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: secret-gitlab
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: gonk-gitlab
                  items:
                    - key: token
                      path: token
        - name: secret-webhook
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: gonk-webhook
                  items:
                    - key: token
                      path: token
        - name: secret-meter-api
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: gonk-meter-api
                  items:
                    - key: token
                      path: token
        # The ed25519 PRIVATE write-auth signing key (gonk-fsl / gonk-5we). Same
        # pre-provisioned Secret the controller pod mounts; the chart creates none.
        - name: secret-gc-write-key
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: gonk-gc-write-key
                  items:
                    - key: key
                      path: key
        # trust-manager publishes `trust-bundle` (key tls-ca-bundle.pem) into EVERY
        # namespace, so this ConfigMap is a NAME, not something you have to create.
        # It is how a Go service trusts https://gitlab.orac.local's private CA --
        # and it is the reason no code in this repo ever sets InsecureSkipVerify.
        - name: orac-ca
          configMap:
            name: trust-bundle
            items:
              - key: tls-ca-bundle.pem
                path: tls-ca-bundle.pem
        - name: tmp
          emptyDir: {}
---
# Source: gonk/templates/deployment-gonk-meter.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gonk-meter
  labels:
    helm.sh/chart: gonk-0.1.0
    app.kubernetes.io/name: gonk
    app.kubernetes.io/instance: gonk
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gonk
    app.kubernetes.io/component: meter
spec:
  replicas: 1
  strategy:
    # Recreate, NOT RollingUpdate. A rolling update runs the old and the new pod
    # at the same time, and gonk-meter's per-project budget lock is IN-PROCESS:
    # two meters, briefly, is the exact state that can grant the last of a budget
    # twice. The cost is a few seconds where /policy/decide is unreachable -- and
    # a decide that fails is a session that does not spawn, which is fail-closed.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gonk
      app.kubernetes.io/instance: gonk
      app.kubernetes.io/component: meter
  template:
    metadata:
      labels:
        helm.sh/chart: gonk-0.1.0
        app.kubernetes.io/name: gonk
        app.kubernetes.io/instance: gonk
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: gonk
        app.kubernetes.io/component: meter
      annotations:
        # Roll the pod when the operator config changes. (Meter also re-reads it
        # from disk on each tick, so this is belt-and-braces -- but a config that
        # fails to validate should surface as a failed rollout, not a quiet
        # "kept the previous config" log line.)
        checksum/operator-config: f75b63bf4a43d143fc2d7f63b733e8227f1722cb5143055eb1cea80acc120af7
    spec:
      serviceAccountName: gonk-meter
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: gitlab-registry-pull-creds
      containers:
        - name: meter
          image: registry.orac.local/agentic/gonk-project/gonk-meter:v0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --operator-config=/etc/gonk/operator/operator-config.yaml
            - --listen=:8080
          env:
            # *** NO SECRET VALUE IS AN ENV VAR. These are PATHS. ***
            - name: LITELLM_URL
              value: "http://litellm.litellm.svc.cluster.local:4000"
            - name: LITELLM_ADMIN_KEY_FILE
              value: "/etc/gonk/secrets/litellm/admin-key"
            - name: GONK_METER_TOKEN_FILE
              value: "/etc/gonk/secrets/meter-api/token"
            # THE STORE. Both are REQUIRED and neither has a default: defaulting
            # to the in-memory store would lose reservations on every restart,
            # which is fail-OPEN on budget headroom. `memory` is not selectable
            # at all (values.schema.json + G15). An unknown backend, an empty
            # DSN file, or a store that will not connect is a FATAL startup error.
            - name: GONK_METER_STORE_BACKEND
              value: "postgres"
            - name: GONK_METER_STORE_DSN_FILE
              value: "/etc/gonk/secrets/ledger/dsn"
            # The KeySink (Task 4) writes per-project Secrets into this namespace.
            - name: GONK_KEYSINK_NAMESPACE
              value: "gonk"
            - name: GONK_KEYSINK_PREFIX
              value: "gonk-key-"
            # THE PRIVATE CA, for symmetry with intake (design table: "Private CA
            # everywhere"). `SSL_CERT_FILE` is ALREADY set by the image's own ENV
            # line (images/Dockerfile.meter) -- this is belt-and-braces, and it is
            # what makes the file the env var names actually EXIST on disk.
            - name: SSL_CERT_FILE
              value: "/etc/ssl/orac/ca.crt"
          ports:
            - name: http-api
              containerPort: 8080
          # /healthz = the process is alive.
          livenessProbe:
            httpGet: {path: /healthz, port: http-api}
            initialDelaySeconds: 5
            periodSeconds: 20
          # /readyz = the FIRST SPEND SYNC has completed. Until then meter's view
          # of what has been spent is empty, and an empty view is fail-OPEN on
          # headroom -- so it must not serve /policy/decide. A long cold start is
          # correct behaviour; give it room.
          readinessProbe:
            httpGet: {path: /readyz, port: http-api}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          startupProbe:
            httpGet: {path: /healthz, port: http-api}
            periodSeconds: 3
            failureThreshold: 20
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: operator-config
              mountPath: /etc/gonk/operator
              readOnly: true
            - name: secret-litellm
              mountPath: /etc/gonk/secrets/litellm
              readOnly: true
            - name: secret-meter-api
              mountPath: /etc/gonk/secrets/meter-api
              readOnly: true
            - name: secret-ledger
              mountPath: /etc/gonk/secrets/ledger
              readOnly: true
            # The private-CA bundle, mounted at exactly the path SSL_CERT_FILE
            # names. subPath so the file lands at /etc/ssl/orac/ca.crt and not
            # in a dir (mirrors gonk-intake's own mount, Task 5).
            - name: orac-ca
              mountPath: /etc/ssl/orac/ca.crt
              subPath: tls-ca-bundle.pem
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: operator-config
          configMap:
            name: gonk-operator-config
        - name: secret-litellm
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: gonk-litellm
                  items:
                    - key: admin-key
                      path: admin-key
        - name: secret-meter-api
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: gonk-meter-api
                  items:
                    - key: token
                      path: token
        - name: secret-ledger
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: gonk-ledger
                  items:
                    - key: dsn
                      path: dsn
        # trust-manager publishes `trust-bundle` (key tls-ca-bundle.pem) into
        # EVERY namespace, so this ConfigMap is a NAME, not something you have
        # to create.
        - name: orac-ca
          configMap:
            name: trust-bundle
            items:
              - key: tls-ca-bundle.pem
                path: tls-ca-bundle.pem
        - name: tmp
          emptyDir: {}
---
# Source: gonk/templates/workload-gonk-controller.yaml
# The bundled Gas City controller. SETTLED by Task 0.5 + the gonk-fsl re-smoke
# (smoke/gc-controller-smoke.md), overriding the plan's provisional draft:
#   - `gc start --foreground /city` as PID 1 (NOT `gc supervisor run`, which logs
#     `[api] port=9443 ... ignored under supervisor mode` and never binds 9443).
#     Foreground mode binds the per-city [api] on 0.0.0.0:9443, calls
#     WithAnyHostAllowed() (any Host, NO allowed_hosts, no 421), and is the only
#     mode that serves the /v0/city/<city>/order/<name>/run route intake dispatches
#     to. NEVER `gc register` (daemonizes a second supervisor and crashes PID 1).
#   - GRANT-GATED: the [api] plane is 0.0.0.0 + allow_mutations=true, i.e. an
#     UNAUTHENTICATED mutation endpoint unless write-auth is on. GC_CITY_WRITE_PUBKEY
#     (gascity.writeAuth.verifyKey) turns on ed25519 grant verification; intake and
#     the in-pod gonk-gate sign every POST with the matching private key. G22 fails
#     the render closed if either half is missing.
#   - City NAME must be `gonk`: foreground mode serves the name from city.toml
#     [workspace], and intake's client dials /v0/city/gonk/... (hardcoded). A
#     mismatch passes auth then 404s city-not-found -- so `gc init --name gonk`.
#   - prebaked delivery: an initContainer copies the baked pack into a WRITABLE
#     emptyDir /city and runs `gc init --preserve-existing --bootstrap-profile
#     k8s-cell` (writes [api] bind=0.0.0.0/allow_mutations=true/port=9443; a
#     read-only ConfigMap at /city is not viable -- smoke U2);
#   - Deployment, replicas 1, strategy Recreate (StatefulSet is the single-instance
#     alternative). No leader election exists, so EXACTLY ONE controller runs.
#
# The gonk-fsl re-smoke proved the full CSRF + ed25519 write-auth + order-handler
# path end-to-end on the fixed image (local, torn down); the charttest gate asserts
# this SHAPE renders. In-cluster 9443 cross-pod reachability is the remaining check.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gonk-controller
  labels:
    helm.sh/chart: gonk-0.1.0
    app.kubernetes.io/name: gonk
    app.kubernetes.io/instance: gonk
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gonk
    app.kubernetes.io/component: controller
spec:
  # EXACTLY ONE. No leader election (smoke U3): two reconcile loops would race the
  # Dolt beads store. Pinned to 1 and deliberately NOT exposed as a knob.
  replicas: 1
  # Recreate, never RollingUpdate: maxSurge could briefly run two controllers
  # during a rollout (smoke U3). Recreate terminates the old pod before the new one
  # starts -- the exactly-one guarantee in the absence of leader election.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gonk
      app.kubernetes.io/instance: gonk
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        helm.sh/chart: gonk-0.1.0
        app.kubernetes.io/name: gonk
        app.kubernetes.io/instance: gonk
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: gonk
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: gc-controller
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: gitlab-registry-pull-creds
      # PREBAKED DELIVERY (smoke U2). The gonk pack is baked into the image at
      # /opt/gonk/pack. This initContainer copies it into the writable emptyDir
      # /city and runs `gc init --preserve-existing` (which keeps the gonk pack.toml
      # -- `gc init --template gascity` would DISCARD it and pull remote GitHub
      # imports) with `--bootstrap-profile k8s-cell` (which writes the
      # [api] bind=0.0.0.0/allow_mutations=true/port=9443 block). The exact command
      # is the one the smoke recorded as working.
      initContainers:
        - name: bootstrap-city
          image: registry.orac.local/agentic/gonk-project/gonk-controller:v0.1.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              cp -r /opt/gonk/pack/. /city/
              # --name gonk is LOAD-BEARING: `gc start --foreground` serves the city
              # under the name in city.toml [workspace], and intake dials
              # /v0/city/gonk/... (hardcoded). Without it gc init defaults the name to
              # "city" and every grant/dispatch for "gonk" 404s city-not-found.
              gc init --preserve-existing --bootstrap-profile k8s-cell \
                --name gonk \
                --default-provider claude --skip-provider-readiness \
                --dolt-host "$GC_DOLT_HOST" --dolt-port "$GC_DOLT_PORT" \
                --dolt-database "bd_gonk" \
                --dolt-project-id "gonk" \
                --no-start /city
              # ---- SELECT THE K8S SESSION PROVIDER -------------------------------
              # THIS IS THE ONLY THING THAT MAKES AGENT SESSIONS RUN AS PODS, and it
              # is CITY CONFIG, NOT ENV. config.SessionConfig is `toml:"session"` on
              # the city config; Gas City has no GC_SESSION_PROVIDER at all (the
              # string does not appear in its source at GASCITY_REF). The chart used
              # to set that env, which did nothing: the runtime defaulted to tmux and
              # every session "started" successfully while logging `tmux server
              # unreachable: no tmux server running` and never creating a pod.
              #
              # Written here rather than passed to `gc init` because init has no flag
              # for it. Appended only when absent so a re-run is idempotent; the
              # GC_K8S_* details (image/namespace/SA/prebaked) stay env, which IS
              # where the provider reads them.
              if ! grep -q '^\[session\]' /city/city.toml; then
                printf '\n[session]\nprovider = "k8s"\n' >> /city/city.toml
                echo "bootstrap-city: selected the k8s session provider in city.toml"
              fi

              # ---- STATIC SESSION CREDS (gonk-aql, v1-minimal) -------------------
              # An agent SESSION pod's env is resolved.Env -- the agent/city config
              # -- plus a fixed passthrough allow-list. Controller env does NOT
              # reach it and neither does any per-session order arg (GC_WEBHOOK_ARG_*
              # is an EXEC-order overlay). So the only way to hand the session its
              # LiteLLM endpoint/key and bot token is to write them into the agent
              # config in /city, here, from the mounted secret files.
              #
              # These are STATIC per-install values, which is exactly why this works;
              # the per-session values (model, attribution metadata) cannot come this
              # way and ride the prompt instead (see pack/formulas/gonk-triage.toml).
              #
              # THIS PUTS TWO CREDENTIALS IN A FILE IN /city -- a DELIBERATE v1
              # compromise, the same one the pack documents, removed by the v2 broker
              # (which keeps every cred out of the pod). /city is an emptyDir private
              # to this pod, and the file is only readable by the runtime user.
              #
              # Inserted directly after the existing `[env]` header rather than
              # appended: appending to EOF happens to land in [env] today only
              # because [env] is the last table, and that is not a property worth
              # depending on.
              LITELLM_KEY=$(cat /etc/gonk/secrets/litellm/admin-key)
              BOT_TOKEN=$(cat /etc/gonk/secrets/gitlab-bot/token)
              for agent_dir in /city/agents/*/; do
                agent_toml="${agent_dir}agent.toml"
                [ -f "$agent_toml" ] || continue
                # NEVER give the control-dispatcher a credential. It is the
                # providerless deterministic control lane -- it runs `gc`, never a
                # model, and handing it the LiteLLM key and the bot token would put
                # both in a pod that has no use for either.
                case "$agent_dir" in */control-dispatcher/) continue ;; esac
                grep -q '^\[env\]' "$agent_toml" || printf '\n[env]\n' >> "$agent_toml"
                awk -v url='http://litellm.litellm.svc.cluster.local:4000' \
                    -v key="$LITELLM_KEY" -v bot="$BOT_TOKEN" \
                    -v host='https://gitlab.orac.local' '
                  /^\[env\]/ && !seen {
                    print
                    printf "GONK_LITELLM_URL = \"%s\"\n", url
                    printf "GONK_LITELLM_KEY = \"%s\"\n", key
                    printf "GONK_BOT_TOKEN = \"%s\"\n", bot
                    printf "GONK_GITLAB_URL = \"%s\"\n", host
                    seen = 1
                    next
                  }
                  { print }
                ' "$agent_toml" > "${agent_toml}.new"
                mv "${agent_toml}.new" "$agent_toml"
                chmod 0600 "$agent_toml"
              done
              echo "bootstrap-city: injected static session creds into $(ls -d /city/agents/*/ | wc -l) agent config(s)"

              # NOTE: do NOT write ~/.gc/cities.toml here. Registering the city makes
              # `gc start --foreground /city` refuse it ("run `gc unregister /city`
              # before using --foreground") and crash-loop (gonk-fsl in-cluster
              # re-smoke, blocker A). Foreground mode runs the city directly from the
              # explicit /city path -- no registration is needed or wanted.
          env:
            - name: HOME
              value: /home/gonk
            - name: GC_DOLT_HOST
              value: "gonk-dolt.gonk.svc"
            - name: GC_DOLT_PORT
              value: "3306"
            - name: SSL_CERT_FILE
              value: "/etc/ssl/orac/ca.crt"
          volumeMounts:
            - name: city
              mountPath: /city
            - name: home
              mountPath: /home/gonk
            - name: tmp
              mountPath: /tmp
            - name: orac-ca
              mountPath: /etc/ssl/orac/ca.crt
              subPath: tls-ca-bundle.pem
              readOnly: true
            # The bootstrap reads these to write the static session creds into the
            # per-agent config in /city (see the cred block in args above).
            - name: secret-litellm
              mountPath: /etc/gonk/secrets/litellm
              readOnly: true
            - name: secret-gitlab-bot
              mountPath: /etc/gonk/secrets/gitlab-bot
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
      containers:
        - name: controller
          image: registry.orac.local/agentic/gonk-project/gonk-controller:v0.1.0
          imagePullPolicy: IfNotPresent
          # `gc start --foreground /city` as PID 1 via `exec` (gonk-fsl re-smoke).
          # Foreground mode binds the per-city [api] on 0.0.0.0:9443 and serves the
          # order-run route; `gc supervisor run` ignores 9443 and never binds it.
          # `gc register` MUST NOT be used -- it daemonizes a second supervisor that
          # then kills PID 1. The city dir is passed explicitly, so no registration
          # is needed.
          command: ["/bin/sh", "-c", "exec gc start --foreground /city"]
          env:
            - name: HOME
              value: /home/gonk
            - name: GC_DOLT_HOST
              value: "gonk-dolt.gonk.svc"
            - name: GC_DOLT_PORT
              value: "3306"
            - name: SSL_CERT_FILE
              value: "/etc/ssl/orac/ca.crt"
            # WRITE-AUTH (gonk-fsl / gonk-5we). GC_CITY_WRITE_PUBKEY turns on
            # ed25519 grant verification on the [api] mutation plane (env overrides
            # city.toml). It is the PUBLIC key -- not a secret. GONK_CITY + the
            # GONK_GC_WRITE_* env below are for the in-pod gonk-gate (the exec
            # orders: dispatch/sweep), which SIGNS its own loopback order-run POSTs
            # with the matching PRIVATE key mounted below -- same keypair/kid as
            # gonk-intake.
            - name: GONK_CITY
              value: gonk
            # WHERE THE IN-POD gonk-gate POSTS ITS POUR. gonk-dispatch runs inside
            # THIS pod and calls POST /v0/city/gonk/order/gonk-triage/run on the
            # city [api] -- so it needs the supervisor URL exactly like gonk-intake
            # does. Without it gcapi builds a URL with no scheme or host and the
            # pour dies on `unsupported protocol scheme ""` -- AFTER meter has
            # already decided, so the budget decision is spent and nothing pours.
            # Same helper as intake's (the bundled controller Service on 9443), so
            # the two can never disagree about where the city is.
            - name: GONK_SUPERVISOR_URL
              value: "http://gonk-controller.gonk.svc:9443"
            - name: GC_CITY_WRITE_PUBKEY
              value: "k1:1hcioE4eYD4PsM66wVJ8oBErEfCTyNPt9Q/+ZT0drmk="
            - name: GONK_GC_WRITE_KEY_FILE
              value: "/etc/gonk/secrets/gc-write-key/key"
            - name: GONK_GC_WRITE_KEY_ID
              value: "k1"
            # K8S SESSION PROVIDER (gonk-aql). GC_SESSION_PROVIDER=k8s (controllerEnv)
            # tells the supervisor to spawn agent SESSION pods, but the provider
            # (internal/runtime/k8s/provider.go @ GASCITY_REF) needs to be told WHICH
            # image, in WHICH namespace, under WHICH SA -- none of which the chart set
            # before. GC_K8S_IMAGE is the one place componentImages.agent is consumed
            # (it was dead config until now). PREBAKED=true skips the staging init
            # container + workspace-ready wait: the agent image is self-contained
            # (opencode + tools baked) and triage injects its context, so no rig
            # clone is staged into the pod.
            - name: GC_K8S_IMAGE
              value: "registry.orac.local/agentic/gonk-project/gonk-agent:"
            - name: GC_K8S_NAMESPACE
              value: "gonk"
            - name: GC_K8S_SERVICE_ACCOUNT
              value: gc-agent
            - name: GC_K8S_PREBAKED
              value: "true"
            # v1-minimal session-config delivery (gonk-aql). The in-controller
            # gonk-gate `dispatch` reads these and forwards them to the agent
            # session as order vars (GC_WEBHOOK_ARG_{LITELLM_URL,LITELLM_KEY,
            # BOT_TOKEN}), because Gas City mounts no gonk secrets into session
            # pods and controller env does not flow to sessions.
            #
            # EVERY SECRET HERE IS A *PATH*, NOT A VALUE, AND THE ENV NAME CARRIES
            # NO SECRET MARKER. Gas City's internal/execenv.IsSensitiveKey flags any
            # key containing TOKEN/SECRET/PASSWORD/API_KEY/... and FilterInherited
            # STRIPS those from the environment of an exec order -- gonk-dispatch IS
            # an exec order, so a `GONK_LITELLM_KEY` / `GONK_BOT_TOKEN` /
            # `GONK_METER_TOKEN_FILE` env arrives EMPTY in gonk-gate no matter what
            # the chart sets. (`[order.env]` in the pack is not a workaround either:
            # `gc init` drops that block when it copies the pack into /city.) So the
            # names below are deliberately marker-free -- KEY_FILE, BOT_FILE,
            # BEARER_FILE -- and gonk-gate reads the file at the path. Renaming any
            # of them to *_TOKEN* silently breaks dispatch again.
            #
            # The KEY MATERIAL still ends up in an order var (litellm_key/bot_token)
            # on the way to the session pod: a DELIBERATE v1 compromise the v2 broker
            # removes by keeping all creds out of the pod entirely.
            - name: GONK_LITELLM_URL
              value: "http://litellm.litellm.svc.cluster.local:4000"
            - name: GONK_LITELLM_KEY_FILE
              value: "/etc/gonk/secrets/litellm/admin-key"
            - name: GONK_BOT_FILE
              value: "/etc/gonk/secrets/gitlab-bot/token"
            # The in-controller gonk-gate exec orders (gonk-dispatch, gonk-sweep)
            # call gonk-meter /v1/policy/decide -- they need the meter URL and a
            # bearer-token FILE, exactly like gonk-intake. Without these,
            # `gc: order exec gonk-dispatch failed ... GONK_METER_TOKEN_FILE unset`
            # and NO formula is ever poured (no session spawns). GONK_METER_BEARER_
            # FILE is the marker-free alias gonk-gate falls back to (see above);
            # GONK_METER_TOKEN_FILE is kept for the non-exec callers that do inherit
            # it and for parity with gonk-intake.
            # The bead store gonk-gate records park/run/needs-human state in.
            # WITHOUT IT gonk-gate falls back to an IN-MEMORY store that does not
            # survive a single invocation -- its own warning says "fine for a
            # smoke test, never for the controller" -- so a parked bead would
            # never unpark and an outcome would never be reported, silently. The
            # exec orders run inside this pod, where the city (and its bd store)
            # is /city; `bd` is on PATH in the controller image.
            - name: GONK_BEAD_REPO_DIR
              value: /city
            - name: GONK_METER_URL
              value: "http://gonk-meter:8080"
            - name: GONK_METER_TOKEN_FILE
              value: "/etc/gonk/secrets/meter-api/token"
            - name: GONK_METER_BEARER_FILE
              value: "/etc/gonk/secrets/meter-api/token"
          ports:
            # The per-city [api] listener (0.0.0.0:9443). This is what intake
            # dispatches to and what the Service targets. Port 8372 (the machine-wide
            # supervisor admin API) binds 127.0.0.1 LOOPBACK ONLY and MUST NEVER be
            # exposed by a Service/Ingress/NetworkPolicy (smoke U1).
            - name: supervisor
              containerPort: 9443
          # TCP probe on 9443: the unauthenticated HTTP health endpoints (/health,
          # /v0/readiness) live on the 8372 LOOPBACK admin API, which a kubelet
          # httpGet against the pod IP cannot reach (smoke U1). The only cross-pod
          # liveness signal is the 9443 city-API socket. IMAGE-GATED (gonk-fsl):
          # 9443 does not bind until the image can finish init -- the probe SHAPE is
          # settled, the boot is not.
          livenessProbe:
            tcpSocket: {port: supervisor}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket: {port: supervisor}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: city
              mountPath: /city
            - name: home
              mountPath: /home/gonk
            - name: tmp
              mountPath: /tmp
            - name: orac-ca
              mountPath: /etc/ssl/orac/ca.crt
              subPath: tls-ca-bundle.pem
              readOnly: true
            # The ed25519 PRIVATE write-auth key, 0400, for the in-pod gonk-gate to
            # sign order-run POSTs. Mounted on the SUPERVISOR only (the bootstrap
            # initContainer runs `gc init` and never signs). Same Secret gonk-intake
            # mounts; the chart creates none.
            - name: secret-gc-write-key
              mountPath: /etc/gonk/secrets/gc-write-key
              readOnly: true
            # The meter bearer token for the in-controller gonk-gate exec orders
            # (GONK_METER_TOKEN_FILE above points here).
            - name: secret-meter-api
              mountPath: /etc/gonk/secrets/meter-api
              readOnly: true
            # The LiteLLM virtual key and the GitLab bot token, as FILES, for the
            # gonk-dispatch exec order to read and forward to the session (gonk-aql).
            # They are files rather than env because Gas City strips secret-marked
            # env from exec orders -- see the GONK_*_FILE comment above.
            - name: secret-litellm
              mountPath: /etc/gonk/secrets/litellm
              readOnly: true
            - name: secret-gitlab-bot
              mountPath: /etc/gonk/secrets/gitlab-bot
              readOnly: true
      volumes:
        # /city and /home/gonk MUST be writable by uid 65532 (smoke U2): gc init
        # writes the city into /city and gc writes ~/.gc under HOME. emptyDir, shared
        # between the bootstrap initContainer and the supervisor. NEVER a read-only
        # configMap at /city -- gc init cannot write into it.
        - name: city
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        # The ed25519 PRIVATE write-auth signing key (gonk-fsl / gonk-5we), 0400,
        # from a pre-provisioned Secret (the chart creates none). Used by the in-pod
        # gonk-gate to sign order-run POSTs; G22 requires it when gascity.enabled.
        - name: secret-gc-write-key
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: gonk-gc-write-key
                  items:
                    - key: key
                      path: key
        - name: secret-meter-api
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: gonk-meter-api
                  items:
                    - key: token
                      path: token
        # Session creds the gonk-dispatch exec order forwards to the agent pod
        # (gonk-aql): the LiteLLM virtual key and the GitLab bot token, 0400.
        - name: secret-litellm
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: gonk-litellm
                  items:
                    - key: admin-key
                      path: admin-key
        - name: secret-gitlab-bot
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: gonk-gitlab
                  items:
                    - key: token
                      path: token
        # The private-CA bundle (trust-manager publishes `trust-bundle` into every
        # namespace). gc clones the city's git remote from https://gitlab.orac.local,
        # whose cert is signed by the cluster CA; SSL_CERT_FILE names this path.
        - name: orac-ca
          configMap:
            name: trust-bundle
            items:
              - key: tls-ca-bundle.pem
                path: tls-ca-bundle.pem
---
# Source: gonk/templates/statefulset-gonk-dolt.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gonk-dolt
  labels:
    helm.sh/chart: gonk-0.1.0
    app.kubernetes.io/name: gonk
    app.kubernetes.io/instance: gonk
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gonk
    app.kubernetes.io/component: dolt
spec:
  # ONE replica, ALWAYS. dolt sql-server is not clustered here; the Gas City
  # beads store needs ONE writer with real transactions. RECONCILED, Task 0:
  # this server hosts the beads database ONLY -- gonk-meter's reservation path
  # (the ledger) is Postgres/CNPG, never a database on this server (ADR-004
  # Decision 10; docs/spikes/dolt-reservation-isolation.md).
  replicas: 1
  serviceName: gonk-dolt
  selector:
    matchLabels:
      app.kubernetes.io/name: gonk
      app.kubernetes.io/instance: gonk
      app.kubernetes.io/component: dolt
  template:
    metadata:
      labels:
        helm.sh/chart: gonk-0.1.0
        app.kubernetes.io/name: gonk
        app.kubernetes.io/instance: gonk
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: gonk
        app.kubernetes.io/component: dolt
    spec:
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: gitlab-registry-pull-creds
      containers:
        - name: dolt
          image: docker.io/dolthub/dolt-sql-server:2.1.7
          imagePullPolicy: IfNotPresent
          # Auth is root / empty password / --no-tls, host+port only. There is no
          # credential to configure, so the chart does not pretend to (env doc).
          env:
            # HOME is LOAD-BEARING (gonk-fsl in-cluster re-smoke, blocker C). The
            # dolthub image assumes it runs as root (HOME=/root) and sets no HOME
            # env; under this chart's podSecurityContext (runAsUser 65532) HOME then
            # resolves to `/`, and dolt dies on `mkdir /.dolt: permission denied`
            # writing its global config. Point HOME at the PVC mount (writable by
            # 65532 via fsGroup) so dolt writes .dolt alongside its data. The
            # controller template solves the identical uid/HOME problem the same way.
            - name: HOME
              value: /var/lib/dolt
            # dolt sql-server creates root@${DOLT_ROOT_HOST:-localhost} on FIRST
            # init. The default root@localhost rejects the controller's CROSS-POD
            # login (gonk-fsl in-cluster re-smoke, blocker B: `Error 1045 Access
            # denied for user 'root'`) -- loopback masked it in every local smoke.
            # `%` creates a remotely-usable root so the Gas City beads store is
            # reachable from the controller pod. Still no password, still --no-tls
            # (the documented Dolt auth model -- there is no user/pass/DSN key).
            - name: DOLT_ROOT_HOST
              value: "%"
          # The dolthub image ENTRYPOINT (docker-entrypoint.sh) already runs
          # `dolt sql-server --host=0.0.0.0 --port=3306 "$@"` AND does the
          # DOLT_ROOT_HOST bootstrap (blocker B). Passing sql-server/--host/--port
          # again collides -- `multiple values provided for 'host'` and a crash loop
          # (gonk-fsl in-cluster re-smoke, blocker D). So pass ONLY the extra flags;
          # the entrypoint supplies sql-server/--host/--port. The bundled server
          # therefore LISTENS ON 3306 (entrypoint-fixed) -- dolt.port must stay 3306
          # so the Service/containerPort/GC_DOLT_PORT match the real listener.
          # NOTE: `dolt sql-server` in dolthub 2.1.7 has NO --no-tls flag (TLS is
          # off by default unless tls_cert/tls_key is set) -- passing it is a fatal
          # `unknown option 'no-tls'` crash (gonk-fsl re-smoke, blocker E). Pass only
          # --data-dir (not injected by the entrypoint); host/port come from it.
          args:
            - --data-dir=/var/lib/dolt
          ports:
            - name: mysql
              containerPort: 3306
          # A TCP probe only: authenticating a real query would need a client, and
          # this server has no credential to authenticate anyway.
          livenessProbe:
            tcpSocket: {port: mysql}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket: {port: mysql}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/dolt
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
---
