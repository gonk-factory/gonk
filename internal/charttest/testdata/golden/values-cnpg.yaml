# Source: gonk/templates/servicemonitor-gonk-meter.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gonk-meter
  labels:
    helm.sh/chart: gonk-0.1.0
    app.kubernetes.io/name: gonk
    app.kubernetes.io/instance: gonk
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gonk
    app.kubernetes.io/component: meter
spec:
  # meter has ONE listener; /healthz, /readyz and /metrics are unauthenticated on
  # it, every other path requires the bearer token (Task 5). No internal/public
  # split like intake, so there is only one Service to select.
  selector:
    matchLabels:
      app.kubernetes.io/name: gonk
      app.kubernetes.io/instance: gonk
      app.kubernetes.io/component: meter
  endpoints:
    - port: http-api
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
